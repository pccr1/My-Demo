<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>感情占卜 · 吸引但伤害的类型</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0718; font-family: 'Inter', sans-serif; color: #f0eefc; padding: 2rem 1rem; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 30%, rgba(110,70,200,0.15), transparent 60%); pointer-events: none; z-index: 0; }
        .container { max-width: 800px; margin: 0 auto; position: relative; z-index: 2; }
        .back-home { display: inline-block; margin-bottom: 1.5rem; background: rgba(255,255,255,0.1); padding: 0.4rem 1rem; border-radius: 40px; text-decoration: none; color: #ffbbf0; font-size: 0.8rem; }
        .card { background: rgba(18, 16, 40, 0.7); backdrop-filter: blur(12px); border-radius: 2rem; padding: 1.5rem; border-left: 5px solid #ff77c6; }
        h1 { font-size: 1.8rem; margin-bottom: 1rem; color: #ffd6f0; }
        .question-item { margin-bottom: 1.5rem; background: rgba(0,0,0,0.25); border-radius: 1rem; padding: 1rem; }
        .question-text { font-weight: 600; margin-bottom: 0.8rem; }
        .options-group { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .opt-label { background: rgba(255,255,240,0.07); padding: 0.5rem 1rem; border-radius: 40px; font-size: 0.85rem; cursor: pointer; transition: 0.1s; border: 1px solid transparent; }
        .opt-label.selected { background: #bf5eff40; border-color: #e27eff; color: white; }
        input[type="radio"] { display: none; }
        button { background: linear-gradient(95deg, #b45eff, #ff6bc0); border: none; padding: 0.8rem 1.8rem; font-weight: 700; border-radius: 60px; color: #0a041a; cursor: pointer; font-size: 1rem; margin-top: 1rem; width: 100%; }
        .result { margin-top: 1.5rem; background: rgba(0,0,0,0.45); border-radius: 1.5rem; padding: 1rem; border-left: 4px solid #ff7bc2; display: none; }
        .footer { text-align: center; font-size: 0.7rem; color: #6b62a0; margin-top: 2rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>⚠️ 我在感情中最容易被哪种类型的人“吸引但伤害”？</h1>
        <div id="questionsContainer"></div>
        <button id="submitBtn">✨ 查看结果 ✨</button>
        <div id="resultArea" class="result"></div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 感情占卜</div>
</div>

<script>
    const questions = [
        { text: "你最容易对哪种描述的人产生好感？", opts: ["话不多、捉摸不透、有故事","充满热情、行动力强、会带你疯","有某项才艺或特长、聪明、独特","温柔体贴、情绪稳定、让人安心"], scores: [[2,0,0,0],[0,2,0,0],[0,0,2,0],[0,0,0,2]] },
        { text: "回顾你的前任或喜欢过的人，他们的共同点是？", opts: ["总让你猜他们在想什么","在一起时轰轰烈烈，分开时猝不及防","你是因为欣赏他们的才华或能力才上头的","对你很好，但最后你觉得无聊或不够爱"], scores: [[2,0,0,0],[0,2,0,0],[0,0,2,0],[0,0,0,1]] },
        { text: "你更容易在哪种情况下觉得自己“完了，沦陷了”？", opts: ["对方若即若离，你追着跑","对方做了件特别浪漫/冲动的事","对方展示了某个你做不到的才华","对方在你脆弱时给了你温暖"], scores: [[3,0,0,0],[0,2,0,0],[0,0,2,0],[0,0,0,2]] },
        { text: "你的朋友最常劝你的一句话是？", opts: ["“你越追他越跑”","“你冷静一点，别那么上头”","“你是不是喜欢他的光环，不是他本人？”","“他人挺好的，但你不觉得太平淡了吗？”"], scores: [[2,0,0,0],[0,2,0,0],[0,0,2,0],[0,0,0,2]] },
        { text: "你和上一任分手的核心原因最接近？", opts: ["忽冷忽热，你受不了了","情绪大起大落，太累了","太自我中心，只关心自己的事","没有激情，像室友","没有上一任"], scores: [[2,0,0,0],[0,2,0,0],[0,0,2,0],[0,0,0,2],[0,0,0,0]] },
        { text: "你内心深处最害怕的是？", opts: ["被欺骗、被隐瞒","被抛弃、对方突然不爱了","被忽视、对方只爱自己","被困住、没有成长和新鲜感"], scores: [[1,0,0,0],[0,2,0,0],[0,0,2,0],[0,0,0,2]] }
    ];

    let answers = new Array(questions.length).fill(null);

    function render() {
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-item">
                        <div class="question-text">${q.text}</div>
                        <div class="options-group" data-qidx="${idx}">`;
            q.opts.forEach((opt, oidx) => {
                let selectedClass = (answers[idx] === oidx) ? 'selected' : '';
                html += `<label class="opt-label ${selectedClass}" data-oidx="${oidx}">${opt}<input type="radio" name="q${idx}" value="${oidx}"></label>`;
            });
            html += `</div></div>`;
        });
        document.getElementById("questionsContainer").innerHTML = html;
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.opt-label').forEach(label => {
            label.addEventListener('click', function(e) {
                let group = this.closest('.options-group');
                let qidx = group.dataset.qidx;
                let oidx = this.dataset.oidx;
                answers[qidx] = parseInt(oidx);
                group.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                let radio = this.querySelector('input');
                if (radio) radio.checked = true;
            });
        });
    }

    function getResult() {
        let shenmi = 0, relie = 0, caihua = 0, wending = 0;
        for (let i = 0; i < questions.length; i++) {
            let idx = answers[i];
            if (idx === null) return null;
            let [sm, rl, ch, wd] = questions[i].scores[idx];
            shenmi += sm; relie += rl; caihua += ch; wending += wd;
        }
        let max = Math.max(shenmi, relie, caihua, wending);
        if (shenmi === max) return "神秘型";
        if (relie === max) return "热烈型";
        if (caihua === max) return "才华型";
        return "稳定型";
    }

    const resultTexts = {
        "神秘型": "“你容易被那些‘不说话、不主动、不拒绝’的人吸引。TA像一本只有目录没有内容的书，你拼命想翻到后面，结果发现全是空白。伤害模式：你越追TA越逃，你越问TA越不说。最后你陷入自我怀疑‘是不是我不够好’。破解方法：你比TA更神秘。对方三天不回消息，你下次五天不回。不解释、不追问、不讨好。只有你用TA的魔法才能打败TA。或者直接拉黑，海那么大，别吊死在一艘幽灵船上。”",
        "热烈型": "“你喜欢那种‘第一天说爱你，第三天说分手’的过山车型。TA能让你在三秒内脸红心跳，也能在一周后让你哭成狗。伤害模式：激情来得快去得也快，你刚上头，TA已经下头。你以为是爱情，TA可能只是无聊。破解方法：把‘三个月试用期’刻在脑门上。对方再热烈，你也得等90天再确认关系。如果TA等不了，那刚好——热得快的东西凉得也快。你不是救火队，别追着快要熄灭的火跑。”",
        "才华型": "“你容易被‘满身技能、光芒四射’的人吸引。TA会弹琴、会编程、会说话、会哄人，你觉得TA是天才。伤害模式：TA的光照亮你，也让你看不见自己。你变成粉丝，TA变成偶像。最后你会发现，TA爱的是自己的才华，不是你。破解方法：分清楚‘欣赏’和‘喜欢’。你可以为TA鼓掌，但别跪下。去培养你自己的才华，让你们站在同一个舞台上，而不是观众席。如果你的才华只能用来夸TA，那趁早换人。”",
        "稳定型": "“你容易被那些‘对你很好、情绪稳定、像温水’的人吸引。最初你觉得安全，后来你觉得无聊。伤害模式：你既舍不得离开，又觉得没激情。最后你可能因为‘没感觉了’而伤害对方，或者因为‘习惯了’而慢性死亡。破解方法：别把‘稳定’和‘无趣’划等号。主动创造小新鲜感——换个约会地点、学个新技能一起玩、设定共同目标。如果你发现自己真的没法爱一个稳定的人，那就别耽误人家，去找个让你心跳的。但别回头又喊‘好男人都去哪了’。”"
    };

    document.getElementById("submitBtn").onclick = () => {
        let res = getResult();
        if (res === null) {
            alert("请先完成所有题目");
            return;
        }
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 最易吸引但伤害你的类型：${res} ✨</strong><br><br>${resultTexts[res]}`;
        resultDiv.style.display = "block";
    };

    render();
</script>
</body>
</html>
