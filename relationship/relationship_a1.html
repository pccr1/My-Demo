<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>感情占卜 · 正缘or过客</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', sans-serif;
            color: #f0eefc;
            padding: 2rem 1rem;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110,70,200,0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-home {
            display: inline-block;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            color: #ffbbf0;
            font-size: 0.8rem;
        }
        .card {
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border-left: 5px solid #ff77c6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffd6f0;
        }
        .question-item {
            margin-bottom: 1.5rem;
            background: rgba(0,0,0,0.25);
            border-radius: 1rem;
            padding: 1rem;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .opt-label {
            background: rgba(255,255,240,0.07);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }
        .opt-label.selected {
            background: #bf5eff40;
            border-color: #e27eff;
            color: white;
        }
        input[type="radio"] { display: none; }
        button {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            width: 100%;
        }
        .result {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.45);
            border-radius: 1.5rem;
            padding: 1rem;
            border-left: 4px solid #ff7bc2;
            display: none;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #6b62a0; margin-top: 2rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>💫 我最近会遇见“正缘”还是“过客”？</h1>
        <div id="questionsContainer"></div>
        <button id="submitBtn">✨ 查看结果 ✨</button>
        <div id="resultArea" class="result"></div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 感情占卜</div>
</div>

<script>
    const questions = [
        { text: "最近一周，你刷到恋爱视频时的心态是？", opts: ["关我屁事","好甜，但轮不到我","下一个就是我","立刻转发给某个特定的人"], scores: [[2,0],[1,0],[0,2],[0,3]] },
        { text: "最近三个月认识的新朋友中，有没有一个让你觉得“这个人有点特别”？", opts: ["没有","有，但聊两天没下文","有，而且还在聊，但没见面","有，见过面还想再见"], scores: [[1,0],[2,0],[0,1],[0,3]] },
        { text: "你现在手机里有没有存着某个人的照片，但不是明星、不是壁纸？", opts: ["没有","有，前任的","有，一个最近认识的、有点好感的人","有，但不知道为什么要存"], scores: [[0,0],[0,2],[0,3],[1,0]] },
        { text: "你周末更愿意？", opts: ["宅家，谁也别叫我","和固定的老朋友出去","参加一个新活动/新场所","一个人出去溜达，期待偶遇"], scores: [[1,0],[1,0],[0,2],[0,1]] },
        { text: "如果有人说要给你介绍对象，你的第一反应是？", opts: ["别烦我","先看看照片","见！马上见！","先问问对方人品怎么样"], scores: [[2,0],[1,0],[0,2],[0,1]] },
        { text: "你最近一次心动是因为？", opts: ["没有过，或太久远了","对方的颜值/声音/身材","对方的某个行为（帮你/懂你/照顾你）","聊天时的一个瞬间（接住了你的梗）"], scores: [[1,0],[2,0],[0,3],[0,2]] },
        { text: "你相信“缘分天注定”吗？", opts: ["不信，都是自己争取的","一半一半","信，但自己也得动","全信，等天上掉对象"], scores: [[0,1],[1,1],[0,2],[2,0]] },
        { text: "你的微信置顶里有没有非工作、非闺蜜/兄弟的人？", opts: ["没有","有，但很少聊天，只是没取消置顶","有，每天都聊，但没确定关系","有，是暧昧对象"], scores: [[1,0],[1,0],[0,3],[0,2]] }
    ];

    let answers = new Array(questions.length).fill(null);

    function render() {
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-item">
                        <div class="question-text">${q.text}</div>
                        <div class="options-group" data-qidx="${idx}">`;
            q.opts.forEach((opt, oidx) => {
                let selectedClass = (answers[idx] === oidx) ? 'selected' : '';
                html += `<label class="opt-label ${selectedClass}" data-oidx="${oidx}">${opt}<input type="radio" name="q${idx}" value="${oidx}"></label>`;
            });
            html += `</div></div>`;
        });
        document.getElementById("questionsContainer").innerHTML = html;
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.opt-label').forEach(label => {
            label.addEventListener('click', function(e) {
                let group = this.closest('.options-group');
                let qidx = group.dataset.qidx;
                let oidx = this.dataset.oidx;
                answers[qidx] = parseInt(oidx);
                group.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                let radio = this.querySelector('input');
                if (radio) radio.checked = true;
            });
        });
    }

    function getResult() {
        let zheng = 0, guo = 0;
        for (let i = 0; i < questions.length; i++) {
            let idx = answers[i];
            if (idx === null) return null;
            let [z, g] = questions[i].scores[idx];
            zheng += z;
            guo += g;
        }
        if (zheng >= guo + 3) return "正缘型";
        if (guo >= zheng + 3) return "过客型";
        return "过渡型";
    }

    const resultTexts = {
        "正缘型": "“别刷了，赶紧出门。你未来三个月的正缘可能出现在：快递站、电梯里、或者你朋友组的‘本来不想去’的局。穿得像个人样，别穿睡衣拿外卖。警告：正缘来的时候往往不像正缘，可能第一印象很普通，甚至有点讨厌。给第二次机会，别一棍子打死。你现在要做的：把手机里的前任照片删了，腾出空间给新人。”",
        "过客型": "“你遇到的都是‘烟花型’人——炸一下就跑，好看但不长久。不是你不好，是你太快上头。下次删好友前先等三天，三天后你还想删再删。建议：把你心动的标准从‘他对我笑了’改成‘他愿意为我花时间’。如果最近有人撩你但忽冷忽热，直接当他不存在。你值得更好的，不是更忙的。”",
        "过渡型": "“你现在站在十字路口，往左是正缘，往右是过客，但你还站在原地刷手机。最近会出现一个人，TA给你的感觉是‘好像可以，但又差点意思’。结果完全取决于你：你主动、耐心、不装，可能变正缘；你急躁、上杆子、查岗，必成过客。建议：把节奏放慢一倍，观察对方是否主动。一个月后见分晓。”"
    };

    document.getElementById("submitBtn").onclick = () => {
        let res = getResult();
        if (res === null) {
            alert("请先完成所有题目");
            return;
        }
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 结果：${res} ✨</strong><br><br>${resultTexts[res]}`;
        resultDiv.style.display = "block";
    };

    render();
</script>
</body>
</html>
