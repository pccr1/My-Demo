<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>人生格局 · 十维破局指南 | 灵犀运势馆</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', 'Space Grotesk', system-ui, sans-serif;
            color: #f0eefc;
            line-height: 1.45;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 10%, rgba(110, 70, 200, 0.2), transparent 70%),
                        repeating-linear-gradient(45deg, rgba(255,255,255,0.008) 0px, rgba(255,255,255,0.008) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            position: relative;
            z-index: 2;
        }
        .hero-mini {
            text-align: center;
            margin-bottom: 2.5rem;
            background: rgba(12, 8, 28, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 1.8rem 1rem;
            border: 1px solid rgba(255, 100, 220, 0.4);
        }
        .hero-mini h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            background: linear-gradient(135deg, #FFFFFF, #E2B6FF, #FF8AD0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }
        .hero-mini p { color: #cdbefc; margin-top: 0.5rem; }
        .module-grid { display: flex; flex-direction: column; gap: 2rem; }
        .test-card {
            background: rgba(18, 16, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(210, 140, 255, 0.3);
            overflow: hidden;
            box-shadow: 0 12px 25px -12px black;
        }
        .card-header {
            padding: 1.2rem 1.8rem;
            background: rgba(0,0,0,0.35);
            border-bottom: 1px solid rgba(255, 120, 200, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .card-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(120deg, #fff, #e4bcff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .badge-module {
            background: #ff44aa30;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            border: 0.5px solid #ff86c6;
        }
        .questions-area { padding: 1.5rem 1.8rem; }
        .q-item {
            margin-bottom: 1.5rem;
            background: rgba(25, 20, 50, 0.5);
            border-radius: 1.2rem;
            padding: 0.8rem 1rem;
        }
        .q-text { font-weight: 600; margin-bottom: 0.7rem; font-size: 0.95rem; }
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
        }
        .opt-label {
            background: rgba(255,255,245,0.05);
            padding: 0.45rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .opt-label.selected { background: #bf5eff40; border-color: #e27eff; color: white; }
        input[type="radio"] { accent-color: #c96eff; width: 14px; height: 14px; margin-right: 4px; }
        .action-btn {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 60px;
            font-weight: 700;
            color: #0a041a;
            cursor: pointer;
            margin: 0.5rem 0 1rem;
            transition: 0.2s;
            font-family: inherit;
        }
        .action-btn:hover { transform: scale(0.98); box-shadow: 0 0 8px #ff88dd; }
        .result-box {
            background: rgba(0,0,0,0.5);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
            border-left: 4px solid #ff77c2;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6b62a0;
            border-top: 0.5px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }
        @media (max-width: 680px) {
            .container { padding: 1rem; }
            .questions-area { padding: 1rem; }
            .card-header h2 { font-size: 1.2rem; }
        }
        .result-box i { margin-right: 8px; color: #ffb3e6; }
        .back-home { display: inline-block; margin-bottom: 1rem; background: rgba(255,255,255,0.1); padding: 0.4rem 1rem; border-radius: 40px; text-decoration: none; color: #ffbbf0; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="hero-mini">
        <h1><i class="fas fa-chart-line"></i> 人生格局 · 破局指南 <i class="fas fa-brain"></i></h1>
        <p>毒舌人生教练 | 戳破幻觉，给你可执行的破局点 | 十维深度拆解</p>
    </div>
    <div class="module-grid" id="modulesContainer"></div>
    <footer>⚡ 灵犀人生研究所 · 所有建议均为正向毒舌 | 你的人生剧本，你自己改写</footer>
</div>

<script>
    // ================= 完整十大人格格局模块 =================
    const modules = [
        // 1. 积累期 vs 爆发期 (7道1-5分)
        {
            id: 1,
            title: "📈 我当前的人生阶段，是“积累期”还是“爆发期”？",
            questions: [
                { text: "Q1：过去半年，你主动学习新技能/新知识的天数（累计超过2小时算一天）：", type: "scale", options: ["1=几乎0天", "2=1-10天", "3=11-20天", "4=21-30天", "5=30天以上"] },
                { text: "Q2：你做完一件事后，能拿出一个“作品/结果”的比例：", type: "scale", options: ["1=全是半途而废", "2=偶尔有成果", "3=一半左右有成果", "4=大部分有成果", "5=每件事都有明确产出"] },
                { text: "Q3：你的收入/影响力/能力认可度在过去半年是否有明显上升？", type: "scale", options: ["1=下降", "2=停滞", "3=微微上升", "4=明显上升", "5=翻倍或飞跃"] },
                { text: "Q4：你是否感到“机会变多了”，但时间变少了？", type: "scale", options: ["1=没机会", "2=很少机会", "3=有一些但抓不住", "4=机会多但忙不过来", "5=机会多到需要筛选"] },
                { text: "Q5：你的社交圈中是否有人主动给你介绍资源（项目、人脉、工作机会）？", type: "scale", options: ["1=从来没有", "2=很少", "3=偶尔", "4=经常", "5=频繁且高质量"] },
                { text: "Q6：你晚上睡前是觉得“今天又没干什么”还是“今天不错”？", type: "scale", options: ["1=总是觉得没干啥", "2=经常觉得没干啥", "3=一半一半", "4=经常觉得不错", "5=总是觉得不错"] },
                { text: "Q7：你对自己的三年后是否有清晰画面（包括职业、生活、能力）？", type: "scale", options: ["1=一片模糊", "2=只有一个大概方向", "3=有几个模糊场景", "4=比较清晰", "5=连BGM都想好了"] }
            ],
            compute: (scores) => {
                let total = scores.reduce((a,b)=>a+b,0);
                if (total <= 15) return { type: "积累期", text: "“你种的东西还没发芽，但你每天刨开土看三次。别看了，去浇水。你现在处于‘输入大于输出’的阶段，可能在学新东西、在试错、或者在躺平中隐约焦虑。好消息是：你还有时间；坏消息是：别假装努力。真正的积累不是刷100个教程，是动手做3个烂作品。建议：未来半年只定一个目标——完成一个小而完整的项目（比如一个简单的网站、一篇深度报告、一个副业尝试）。完成比完美重要一万倍。半年内别指望发财，但你可以指望不焦虑。积累期的肥料是耐心和脏手，不是空想。”" };
                if (total <= 25) return { type: "过渡期", text: "“你站在楼梯中间，往上爬有点累，往下看有点晕。你已经积累了一些东西，但还没到爆发的临界点。这是最容易放弃的阶段，因为好像努力了也没什么变化。建议：检查你的‘能量出口’——你是在做高价值的事，还是在低水平重复？如果是后者，砍掉一半杂活，集中火力攻一个高地。过渡期最怕‘均匀用力’，要‘压强突破’。选一个你最有可能做出亮点的方向，花三个月死磕。然后拿着成果去换资源。别急着开香槟，也别急着回头。你离爆发只差一个代表作的距离。”" };
                return { type: "爆发期", text: "“你像一锅马上要溢出来的粥，赶紧给自己找个更大的碗。你现在能量满满、机会不断、产出高频，这是你过去几年积累的红利期。建议：本月内，把你正在做的事往高一个平台推——发大号、投比赛、见大佬、主动要晋升。别谦虚，你的爆发窗口可能只有半年到一年。同时注意：别在爆发期同时做十件事，选两件最重要的，把其他授权或延后。爆发期最容易犯的错是‘贪多嚼不烂’，最后哪个都没爆发成。你的关键词是：聚焦、放大、收割。然后准备下一个积累期。”" };
            }
        },
        // 2. 贵人线索场景
        {
            id: 2,
            title: "🔍 我的人生格局中，最大的“贵人线索”藏在哪里？",
            questions: [
                { text: "Q1：你平时花时间最多（除家和公司外）的场所是？", opts: [{ l: "微信群/知乎/B站/小红书评论区", s: { 线上: 3 } }, { l: "公司/客户办公室/行业会议", s: { 职场: 3 } }, { l: "健身房/兴趣班/朋友饭局/剧本杀", s: { 兴趣: 3 } }, { l: "咖啡厅/书店/展会/随机溜达", s: { 陌生: 2 } }] },
                { text: "Q2：你最近一次“意外得到帮助或机会”是在什么场景下？", opts: [{ l: "在某个社群里提问，有人私信给了详细解答", s: { 线上: 2 } }, { l: "同事或领导多给了你一个露脸的机会", s: { 职场: 2 } }, { l: "朋友的朋友听说你需要什么，主动牵线", s: { 兴趣: 2 } }, { l: "排队/等车时和陌生人聊了几句，发现对方能帮忙", s: { 陌生: 3 } }] },
                { text: "Q3：你更倾向于相信“贵人”会出现在哪种地方？", opts: [{ l: "我常逛的论坛或知识社群", s: { 线上: 1 } }, { l: "公司的关键项目或会议上", s: { 职场: 2 } }, { l: "朋友组的局或共同爱好圈子", s: { 兴趣: 2 } }, { l: "意想不到的偶遇", s: { 陌生: 3 } }] },
                { text: "Q4：你最近有没有主动帮助过别人（不求回报）？", opts: [{ l: "在线上回答过问题、分享过资料", s: { 线上: 2 } }, { l: "在公司帮同事处理了棘手的任务", s: { 职场: 2 } }, { l: "给朋友介绍过资源或单纯听他们倾诉", s: { 兴趣: 2 } }, { l: "对陌生人友善（指路、让座、搭话）", s: { 陌生: 2 } }] },
                { text: "Q5：你觉得自己最容易吸引贵人的特质是什么？", opts: [{ l: "爱分享、爱总结、有干货", s: { 线上: 2 } }, { l: "靠谱、执行力强、能扛事", s: { 职场: 2 } }, { l: "热情、会张罗、情商在线", s: { 兴趣: 2 } }, { l: "好奇、友善、愿意倾听", s: { 陌生: 2 } }] },
                { text: "Q6：如果让你选一个“近期要刻意经营的场景”，你更愿意选？", opts: [{ l: "在一个高质量的付费社群中持续输出", s: { 线上: 2 } }, { l: "主动向行业前辈约一次1对1请教", s: { 职场: 2 } }, { l: "组织一次兴趣圈子的线下聚会", s: { 兴趣: 2 } }, { l: "每周去一个没去过的地方，随机认识人", s: { 陌生: 2 } }] }
            ],
            compute: (answers) => {
                let sc = { 线上: 0, 职场: 0, 兴趣: 0, 陌生: 0 };
                answers.forEach(a => { for (let k in a) if (sc[k] !== undefined) sc[k] += a[k]; });
                let maxKey = Object.keys(sc).reduce((a, b) => sc[a] >= sc[b] ? a : b, '线上');
                const map = { 线上: "线上社群", 职场: "办公室/职场", 兴趣: "兴趣/社交圈", 陌生: "陌生场合" };
                const adv = {
                    线上: "“你的贵人可能藏在某个你常看但很少说话的社群里。不一定是大群，可能是小圈子、知识星球、甚至知乎某个回答的评论区。TA大概率是个‘潜水大佬’，平时不冒泡，但你抛出有价值的问题或分享时，TA会突然出现。建议：每周至少一次在垂直社群输出高质量内容（复盘、资源整理、深度提问），别只发‘谢谢’‘学到了’。贵人喜欢帮助‘看起来值得帮’的人，你的公开笔记就是你的简历。另外，小心别在网上喷人，贵人会默默把你拉黑。”",
                    职场: "“你的贵人很可能就在你公司，甚至坐在你三米以内。TA不是你的直属老板（老板是你的‘评审’不是贵人），而是跨部门的某个低调大神、或者是比你高半级但愿意带你的人。TA的特征：做事稳、消息灵通、愿意分功劳给年轻人。建议：主动约TA吃一顿午饭，请教一个具体的问题（比如‘你上次那个项目怎么搞定XX的’）。别问太空泛的‘如何成功’。另外，帮TA做一些不费时但显诚意的事（整理数据、校对文档），贵人都是从小忙开始帮起的。”",
                    兴趣: "“你的贵人在饭局、球局、剧本杀、或者你朋友的生日趴上。TA可能是你朋友的另一个朋友，你们有共同的爱好，但一直没深聊。贵人的信号：你们第一次聊就能接住彼此的梗，或者TA不经意说‘这个我熟，有问题找我’。建议：下次聚会别只和自己熟的人扎堆，主动坐到陌生人旁边。带一副牌或一个破冰话题（‘你们最近有没有什么烦心事’）。把你擅长的事（比如修图、做攻略）当小礼物送出去。别上来就谈生意，兴趣圈的贵人先交朋友，后谈资源。”",
                    陌生: "“你的贵人像彩蛋，出现在你常规路线之外的地方。可能是你临时起意逛的书店、等咖啡时旁边取餐的人、或者你硬着头皮去的一个陌生活动。TA的出现往往伴随着一个‘巧合’——你刚好在看TA也喜欢的书，或你抱怨了一句TA刚好能解决。建议：每周给自己一次‘随机事件’——去一家没去过的店、参加一个完全陌生的活动、或者主动和看起来顺眼的陌生人说一句话（哪怕只是‘这个好吃吗’）。贵人不会在沙发上等你，你得出门碰运气。但别抱着‘非要遇贵人’的心态，否则你会像推销员一样惹人烦。随缘，但随缘的前提是你人在外面。”"
                };
                return { type: map[maxKey], text: adv[maxKey] };
            }
        },
        // 3. 内耗类型
        {
            id: 3,
            title: "🌀 我容易在哪类事情上反复内耗？如何破局？",
            questions: [
                { text: "Q1：你睡前或独处时，脑子里最常出现的念头是？", opts: [{ l: "“凭什么TA行我不行” / “TA比我好太多了”", s: { 比较: 3 } }, { l: "“如果当初我……就好了”", s: { 后悔: 3 } }, { l: "“TA是不是对我有意见” / “我刚才那么说会不会得罪人”", s: { 等待: 3 } }, { l: "“这个还不够好，再改改”", s: { 完美: 3 } }] },
                { text: "Q2：看到朋友/同龄人取得成就（升职、买房、结婚）时，你的第一反应是？", opts: [{ l: "焦虑，觉得自己落后了", s: { 比较: 2 } }, { l: "祝福，但忍不住想自己哪里没做对", s: { 后悔: 1 } }, { l: "羡慕，然后希望别人也认可自己", s: { 等待: 2 } }, { l: "觉得他们运气好，自己也能做到但得更完美", s: { 完美: 2 } }] },
                { text: "Q3：你做错一件事后，通常会？", opts: [{ l: "反复和更差的人比，安慰自己", s: { 比较: 1 } }, { l: "长时间自责，反复想“如果当时不那样就好了”", s: { 后悔: 3 } }, { l: "到处问别人“你觉得我做错了吗”", s: { 等待: 3 } }, { l: "死磕细节试图弥补，甚至推翻重来", s: { 完美: 2 } }] },
                { text: "Q4：你最难忍受的工作/生活状态是？", opts: [{ l: "有人比我强还比我闲", s: { 比较: 2 } }, { l: "因为过去的某个错误，现在还在受影响", s: { 后悔: 2 } }, { l: "做了事但没人看到、没人肯定", s: { 等待: 3 } }, { l: "事情不完美、有瑕疵", s: { 完美: 3 } }] },
                { text: "Q5：你最容易因为什么而拖延？", opts: [{ l: "怕做了也不如别人", s: { 比较: 2 } }, { l: "怕再次做错重蹈覆辙", s: { 后悔: 2 } }, { l: "怕做了但别人不认可", s: { 等待: 2 } }, { l: "怕做得不够好，不如不做", s: { 完美: 3 } }] },
                { text: "Q6：如果有人给你一个“不那么完美但能交差”的方案，你会？", opts: [{ l: "觉得“反正有人更差”", s: { 比较: 1 } }, { l: "后悔自己没早点想到", s: { 后悔: 1 } }, { l: "问领导/朋友“你觉得这样可以吗”", s: { 等待: 2 } }, { l: "忍不住自己动手改到满意为止", s: { 完美: 3 } }] }
            ],
            compute: (answers) => {
                let sc = { 比较: 0, 后悔: 0, 等待: 0, 完美: 0 };
                answers.forEach(a => { for (let k in a) if (sc[k] !== undefined) sc[k] += a[k]; });
                let maxKey = Object.keys(sc).reduce((a, b) => sc[a] >= sc[b] ? a : b, '比较');
                const map = { 比较: "比较型内耗", 后悔: "后悔型内耗", 等待: "等待认同型内耗", 完美: "完美主义型内耗" };
                const adv = {

                    理财: "“你赚得可能不少，但就是留不住。钱像水一样从指缝流走，你不知道去了哪。30岁前不建立理财习惯，30岁后你会陷入‘赚多少花多少’的死循环，永远不敢停、不敢病、不敢换工作。破局方法：今晚就下载记账APP，连续记30天，你会被自己的花钱姿势吓到。然后强制储蓄：发薪日当天转出20%到另一张卡，打死不动。学习三个基础概念：复利、资产/负债、定投。不要碰不懂的投资。你不需要成为股神，你只需要停止为消费主义买单。记住：钱不是省出来的，但乱花一定留不住。你的未来需要本金，你的底气来自存款。”",
                    执行: "“你是‘思想巨人，行动矮子’。收藏了一百个教程，买了几千块的课，但一个都没做完。30岁前不治好拖延，30岁后你会活在一个‘本可以’的平行宇宙里，而现实里的你一事无成。破局方法：选一个你拖最久的小事（比如整理电脑桌面），设5分钟闹钟，立刻做。做完后告诉自己‘原来开始这么简单’。把大目标切成‘最小可执行单元’——不是‘学英语’，是‘背5个单词’。不是‘写书’，是‘写100字’。每天完成一个微行动，打卡30天。不要追求完美，要追求持续。烂开始好过不开始，你迈出第一步就已经超过了90%的人。”"
                };
                return { type: map[maxKey], text: adv[maxKey] };
            }
        },
        // 10. 人生章节主题
        {
            id: 10,
            title: "📖 如果把我的一生看作一本书，这一章的主题应该叫什么？",
            questions: [
                { text: "Q1：你目前对未来的感觉更像？", opts: [{ l: "一切皆有可能，但有点迷茫", s: { a: 2 } }, { l: "有方向，但压力大，怕选错", s: { b: 2 } }, { l: "开始接受现实，想平衡责任和自我", s: { c: 2 } }, { l: "想突破或重新定义人生", s: { d: 2 } }] },
                { text: "Q2：你最近一年最常说的口头禅是？", opts: [{ l: "“算了，随便”", s: { a: 1 } }, { l: "“我好累，但还得干”", s: { b: 2 } }, { l: "“就这样吧，也挺好”", s: { c: 2 } }, { l: "“我还能再抢救一下”", s: { d: 3 } }] },
                { text: "Q3：你对“试错”的态度是？", opts: [{ l: "试错成本低，随便试", s: { a: 2 } }, { l: "怕试错，因为时间不多了", s: { b: 2 } }, { l: "已经有明确的路径，不想折腾", s: { c: 1 } }, { l: "想试但怕代价太大", s: { d: 2 } }] },
                { text: "Q4：你对社交圈的态度更接近？", opts: [{ l: "想认识很多新朋友，但不知道聊什么", s: { a: 1 } }, { l: "核心圈几个，但越来越难交新朋友", s: { b: 2 } }, { l: "懒得社交，舒服最重要", s: { c: 2 } }, { l: "想跳出舒适圈但需要勇气", s: { d: 2 } }] },
                { text: "Q5：你对于“成功”的定义更接近？", opts: [{ l: "被认可、被喜欢", s: { a: 2 } }, { l: "有竞争力、有选择权", s: { b: 2 } }, { l: "平衡、稳定、不焦虑", s: { c: 2 } }, { l: "自由、有意义、不后悔", s: { d: 2 } }] },
                { text: "Q6：如果给你现在的状态写一个章节标题，你会选哪个风格？", opts: [{ l: "《迷雾里的奔跑》", s: { a: 2 } }, { l: "《负重爬坡》", s: { b: 2 } }, { l: "《平缓地带》", s: { c: 2 } }, { l: "《第二座山》", s: { d: 2 } }] }
            ],
            compute: (answers) => {
                let sc = { a: 0, b: 0, c: 0, d: 0 };
                answers.forEach(a => { for (let k in a) if (sc[k] !== undefined) sc[k] += a[k]; });
                let maxKey = Object.keys(sc).reduce((a, b) => sc[a] >= sc[b] ? a : b, 'a');
                const titles = {
                    a: "《试错成本最低的流浪》",
                    b: "《拆掉滤镜，重建地基》",
                    c: "《选择一种节奏，而不是一种结局》",
                    d: "《把“不得不”变成“我选择”》"
                };
                const desc = {
                    a: "“你的人生这本书，这一章的主题是‘迷路中找方向’。你可能刚毕业、刚入行、或者还在探索自己到底想要什么。好消息是：你摔得起。坏消息是：你容易把迷茫当借口什么都不做。建议：这一章别追求‘正确’，多尝试、多搞砸、多认识人。你的任务不是写出一章完美的内容，而是积攒足够多的‘素材’——哪怕是一些烂尾的副业、失败的感情、冲动的决定。这些垃圾素材以后会变成你的宝藏。但注意：别在流浪中弄丢‘好奇心’和‘勇气’。这一章最怕的不是选错，是不敢选。尽量让章节结尾有点小成绩（比如一个证书、一个作品、一笔存款），否则下一章的开头你会很狼狈。”",
                    b: "“你的人生这本书，这一章的主题是‘现实抽脸记’。你开始看到理想和现实的差距，也发现父母不是超人、自己不是天才。这一章的关键词是‘地基’——职业、金钱、健康、核心关系。你可能在加班、在攒钱、在焦虑、在比较。建议：学会和‘不够好’的自己相处，同时保持行动。这一章最容易犯的错是‘既要又要还要’——挑最重要的1-2件事深挖，其他先放下。另外，注意身体，别把地基挖在沙子上。你需要一个‘代表作’（哪怕很小），让未来的自己感谢这一章的你。如果你只是混日子，下一章你会变成《无趣的中年人》。”",
                    c: "“你的人生这本书，这一章的主题是‘和欲望和解’。你可能已经有一些积累（职位、家庭、资产），但也开始感受到天花板和疲惫。这一章的重点不是‘再冲一把’，而是‘找到可持续的节奏’。你可能需要放下一些比较，接受‘够了’；也可能需要鼓起勇气微调方向。建议：每季度做一次‘人生审计’——时间、钱、精力都花在哪了？砍掉那些‘为了面子’的消耗。同时培养一个工作之外的‘自留地’（爱好、副业、社群），防止被单一角色定义。这一章最怕的是‘麻木’——觉得一切还行但没意思。你要的是刚刚好的张力，不是无感。给自己设定一个‘五年后想成为的样子’，然后倒推现在的节奏。慢一点没关系，别停。”",
                    d: "“你的人生这本书，这一章的主题是‘半山腰的觉醒’。你可能已经有了不少责任（家庭、房贷、管理岗），精力不如从前，但内心反而更清楚不想要什么。这一章的核心是‘权力回归’——重新拿回对自己时间和注意力的掌控。你不需要推翻一切，但可以在现有框架里争取‘选择权’。比如：拒绝不必要的应酬、培养一个能变现的爱好、或者开始为‘第二曲线’做准备。建议：每年做一件‘打破常规’的小事（一个人旅行、学一门无用技能、和年轻人做朋友）。这一章最怕的是‘认命’——觉得这辈子就这样了。你还没到终点，你只是换了个赛道。记住：你不是在走下坡路，你只是在走一条更少人的路。把‘不得不’改成‘我选择’，这句话值回票价。”"
                };
                return { type: titles[maxKey], text: desc[maxKey] };
            }
        }
    ];

    // 渲染所有模块
    function renderAll() {
        const container = document.getElementById('modulesContainer');
        container.innerHTML = '';
        modules.forEach(mod => {
            const card = document.createElement('div');
            card.className = 'test-card';
            card.innerHTML = `
                <div class="card-header">
                    <h2>${mod.title}</h2>
                    <div class="badge-module"><i class="fas fa-dice-d6"></i> 毒舌解盘</div>
                </div>
                <div class="questions-area" id="module-${mod.id}-area"></div>
            `;
            container.appendChild(card);
            const area = card.querySelector(`.questions-area`);
            let html = '';
            mod.questions.forEach((q, qidx) => {
                html += `<div class="q-item" data-qidx="${qidx}">
                            <div class="q-text"><i class="fas fa-question-circle"></i> ${q.text}</div>
                            <div class="options-group" data-qidx="${qidx}">`;
                if (q.type === 'scale') {
                    q.options.forEach((opt, oidx) => {
                        const score = oidx + 1;
                        html += `<label class="opt-label" data-val='${score}'>
                                    <input type="radio" name="q${mod.id}_${qidx}" value="${score}"> ${opt}
                                </label>`;
                    });
                } else {
                    q.opts.forEach((opt, oidx) => {
                        html += `<label class="opt-label" data-val='${JSON.stringify(opt.scores)}'>
                                    <input type="radio" name="q${mod.id}_${qidx}" value="${oidx}"> ${opt.l}
                                </label>`;
                    });
                }
                html += `</div></div>`;
            });
            html += `<button class="action-btn" data-module="${mod.id}"><i class="fas fa-chart-simple"></i> 揭晓毒舌真相</button>
                     <div class="result-box" style="display:none;"></div>`;
            area.innerHTML = html;
            // 选项点击高亮
            area.querySelectorAll('.opt-label').forEach(lbl => {
                lbl.addEventListener('click', () => {
                    const radio = lbl.querySelector('input');
                    if (radio) radio.checked = true;
                    const group = lbl.closest('.options-group');
                    group.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                    lbl.classList.add('selected');
                });
            });
            const btn = area.querySelector('.action-btn');
            const resultDiv = area.querySelector('.result-box');
            btn.addEventListener('click', () => {
                let answers = [];
                let missing = false;
                mod.questions.forEach((q, qidx) => {
                    const selected = area.querySelector(`input[name="q${mod.id}_${qidx}"]:checked`);
                    if (!selected) { missing = true; return; }
                    const parent = selected.closest('.opt-label');
                    const raw = parent.getAttribute('data-val');
                    if (q.type === 'scale') {
                        answers.push(parseInt(raw));
                    } else {
                        answers.push(JSON.parse(raw));
                    }
                });
                if (missing) {
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `<i class="fas fa-hand-peace"></i> 请先把所有问题选完，别偷懒～ 毒舌虽毒，但需要你的诚意。`;
                    return;
                }
                const res = mod.compute(answers);
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<i class="fas fa-crystal-ball"></i> <strong>${res.type}</strong><br>${res.text}`;
            });
        });
    }

    window.onload = renderAll;
</script>

</html>
