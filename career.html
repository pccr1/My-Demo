<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', 'Space Grotesk', system-ui, sans-serif;

        }

            content: "";

            left: 0;
            width: 100%;
            height: 100%;

                        repeating-linear-gradient(45deg, rgba(255,255,255,0.008) 0px, rgba(255,255,255,0.008) 2px, transparent 2px, transparent 8px);

        .card-header {
            padding: 1.2rem 1.8rem;
            background: rgba(0,0,0,0.35);
            border-bottom: 1px solid rgba(255, 120, 200, 0.3);

            align-items: center;

            flex-wrap: wrap;
            justify-content: space-between;

        .card-header h2 {
            font-size: 1.6rem;

            color: transparent;
        }
        .badge-module {
            background: #ff44aa30;
            padding: 0.2rem 0.8rem;

        .options-group { display: flex; flex-wrap: wrap; gap: 0.8rem; }
        .opt-label {
            background: rgba(255,255,245,0.05);
            padding: 0.45rem 1rem;

        .opt-label.selected { background: #bf5eff40; border-color: #e27eff; color: white; }
        input[type="radio"] { accent-color: #c96eff; width: 14px; height: 14px; margin-right: 4px; }
        .action-btn {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 60px;
            font-weight: 700;
            color: #0a041a;
            cursor: pointer;
            margin: 0.5rem 0 1rem;
            transition: 0.2s;
            font-family: inherit;
        }
        .action-btn:hover { transform: scale(0.98); box-shadow: 0 0 8px #ff88dd; }
        .result-box {
            background: rgba(0,0,0,0.5);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
            border-left: 4px solid #ff77c2;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6b62a0;
            border-top: 0.5px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }
        @media (max-width: 680px) {
            .container { padding: 1rem; }
            .questions-area { padding: 1rem; }
            .card-header h2 { font-size: 1.2rem; }
        }
        .result-box i { margin-right: 8px; color: #ffb3e6; }
        .back-home { display: inline-block; margin-bottom: 1rem; background: rgba(255,255,255,0.1); padding: 0.4rem 1rem; border-radius: 40px; text-decoration: none; color: #ffbbf0; font-size: 0.8rem; }

    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="hero-mini">
        <h1><i class="fas fa-chart-line"></i> 事业运势 · 十维命格拆解 <i class="fas fa-brain"></i></h1>
        <p>毒舌真相实验室 | 科学瞎扯 + 心理学buff | 每一题都戳中你的事业底裤</p>
    </div>
    <div class="module-grid" id="modulesContainer"></div>
    <footer>⚡ 灵犀事业研究所 · 纯属职场行为分析，仅供参考，别跟老板对质 | 毒舌即正义，清醒即自由</footer>
</div>

<script>
    // ========== 完整十大模块配置 ==========
    const modules = [
        // 1. 长期饭票 vs 过渡跳板
        {
            id: 1,
            title: "🍚 我现在的工作，是“长期饭票”还是“过渡跳板”？",
            questions: [
                { text: "Q1：你每天早上起床，想到上班的第一反应是？", opts: [{ label: "A. “又来了”", scores: { 饭票: 0, 跳板: 2 } }, { label: "B. “今天要做什么”", scores: { 饭票: 1, 跳板: 0 } }, { label: "C. “还行，不讨厌”", scores: { 饭票: 1, 跳板: 0 } }] },
                { text: "Q2：你的工资在过去一年内是否上涨过（包括普调）？", opts: [{ label: "A. 没涨，且公司无明确涨薪机制", scores: { 饭票: 0, 跳板: 3 } }, { label: "B. 涨了，但幅度很小（<5%）", scores: { 饭票: 0, 跳板: 1 } }, { label: "C. 涨了，幅度正常或更多", scores: { 饭票: 2, 跳板: 0 } }] },
                { text: "Q3：你在这份工作中，还能学到新东西或积累有用经验吗？", opts: [{ label: "A. 完全学不到，日常重复劳动", scores: { 饭票: 0, 跳板: 3 } }, { label: "B. 偶尔有，但不多了", scores: { 饭票: 0, 跳板: 1 } }, { label: "C. 还能学到，且对下次跳槽有帮助", scores: { 饭票: 2, 跳板: 0 } }] },
                { text: "Q4：你的同事中，有超过2个人是你未来想成为的样子吗？", opts: [{ label: "A. 有", scores: { 饭票: 2, 跳板: 0 } }, { label: "B. 没有，甚至觉得他们停滞了", scores: { 饭票: 0, 跳板: 2 } }, { label: "C. 不太清楚，不关心", scores: { 饭票: 0, 跳板: 0 } }] },
                { text: "Q5：如果明天你被裁员，你的第一反应是？", opts: [{ label: "A. “爽，可以休息一阵”", scores: { 饭票: 0, 跳板: 1 } }, { label: "B. “完了，房贷/生活费怎么办”", scores: { 饭票: 1, 跳板: 0 } }, { label: "C. “正好，拿钱走人找下家”", scores: { 饭票: 0, 跳板: 2 } }] },
                { text: "Q6：你所在的行业/公司整体趋势是？", opts: [{ label: "A. 下行/萎缩/风险高", scores: { 饭票: 0, 跳板: 3 } }, { label: "B. 平稳，不温不火", scores: { 饭票: 1, 跳板: 1 } }, { label: "C. 上升期/稳定增长", scores: { 饭票: 3, 跳板: 0 } }] },
                { text: "Q7：你觉得自己在这家公司的不可替代性如何？", opts: [{ label: "A. 谁都能做，换个应届生也行", scores: { 饭票: 0, 跳板: 2 } }, { label: "B. 有一定经验壁垒，但不算稀缺", scores: { 饭票: 0, 跳板: 1 } }, { label: "C. 比较核心，短期内很难被替代", scores: { 饭票: 3, 跳板: 0 } }] }
            ],
            compute: (answers) => {
                let 饭票 = 0, 跳板 = 0;
                answers.forEach(a => { 饭票 += a.饭票 || 0; 跳板 += a.跳板 || 0; });
                if (饭票 >= 跳板 + 3) return { type: "长期饭票", text: "“恭喜你，你已经是一只温水里的青蛙了。水还没开，锅里还有肉，你可以再泡一阵子。这份工作稳定、有成长、钱也还行，不是非跳不可。但小心：长期饭票容易养出‘废人综合征’——技能停滞、竞争力下降。建议：每半年更新一次简历，不是为了跳，是为了知道自己在市场上的价格。如果连续两次更新发现价格没涨甚至跌了，那就是警报。另外，别把所有鸡蛋放一个篮子里，发展一个副业或考个证，万一锅突然热了，你还能跳出去。”" };
                if (跳板 >= 饭票 + 3) return { type: "过渡跳板", text: "“你的工作就像过期的酸奶——喝了不会死，但每口都恶心。学不到东西、钱也不涨、行业还在下坡。你留在这里的唯一原因是‘还没找到下家’。建议：立刻更新简历，每周投5家，目标三个月内走人。但别裸辞，骑驴找马。走之前尽可能薅公司资源（培训、证书报销、项目经验）。把这段经历当成跳板上的助跑，别在上面盖房子。另外，别对同事吐槽公司，小心传到老板耳朵里，你连过渡期都保不住。”" };
                return { type: "灰色地带", text: "“你现在的工作不好不坏，像方便面——饿不死，但吃多了会腻。它可以当短期饭票（1-2年），但别当终身事业。你可以继续待着，但要开始布局下一步：要么内部转岗寻求新挑战，要么每周花5小时探索副业或新技能。给自己设一个‘检验点’：半年后如果薪资/能力/行业没有明显变化，就强制跳槽。灰色地带最危险的不是差，而是让你舒服到忘记外面还有更好的。建议：每年面试一两家同行，看看别人在做什么、给多少钱。你会受到刺激的。”" };
            }
        },
        // 2. 专家型 vs 管理型
        {
            id: 2,
            title: "🎯 我更适合做“专家型”还是“管理型”人才？",
            questions: [
                { text: "Q1：你更享受以下哪种工作场景？", opts: [{ label: "A. 独自深度解决问题，不被打扰", scores: { 专家: 2, 管理: 0 } }, { label: "B. 协调团队、安排任务、推动他人", scores: { 专家: 0, 管理: 2 } }, { label: "C. 两者都还行", scores: { 专家: 1, 管理: 1 } }] },
                { text: "Q2：当项目出问题时，你的第一反应是？", opts: [{ label: "A. 自己找原因、动手解决", scores: { 专家: 2, 管理: 0 } }, { label: "B. 召集相关人员开会，分配任务", scores: { 专家: 0, 管理: 2 } }, { label: "C. 先自己分析，再找人配合", scores: { 专家: 1, 管理: 1 } }] },
                { text: "Q3：你更不喜欢哪种情况？", opts: [{ label: "A. 被别人的低效率拖累", scores: { 专家: 0, 管理: 2 } }, { label: "B. 不得不处理人际关系和情绪纠纷", scores: { 专家: 2, 管理: 0 } }, { label: "C. 都不喜欢，但能忍", scores: { 专家: 0, 管理: 0 } }] },
                { text: "Q4：你带过新人或实习生吗？感受如何？", opts: [{ label: "A. 没带过，没兴趣", scores: { 专家: 1, 管理: 0 } }, { label: "B. 带过，觉得心累，不如自己做", scores: { 专家: 2, 管理: 0 } }, { label: "C. 带过，挺有成就感", scores: { 专家: 0, 管理: 2 } }] },
                { text: "Q5：在未来5年的职业规划里，你更看重？", opts: [{ label: "A. 成为某个领域的顶尖专家、不可替代", scores: { 专家: 3, 管理: 0 } }, { label: "B. 带团队、做决策、影响力更大", scores: { 专家: 0, 管理: 3 } }, { label: "C. 钱多事少离家近，不在意头衔", scores: { 专家: 0, 管理: 0 } }] },
                { text: "Q6：你朋友/同事最常形容你的词是？", opts: [{ label: "A. 专业、靠谱、技术流", scores: { 专家: 2, 管理: 0 } }, { label: "B. 有领导力、会来事、能服众", scores: { 专家: 0, 管理: 2 } }, { label: "C. 踏实、好说话", scores: { 专家: 1, 管理: 0 } }] }
            ],
            compute: (answers) => {
                let 专家 = 0, 管理 = 0;
                answers.forEach(a => { 专家 += a.专家 || 0; 管理 += a.管理 || 0; });
                if (专家 >= 管理 + 2) return { type: "专家型", text: "“你是一个典型的技术宅/专业怪，享受一个人死磕的快感。让你管人等于让你吃翔——你嫌别人笨，别人嫌你凶。你的路是：把专业做到前20%，靠手艺吃饭。别羡慕那些天天开会的，他们可能还羡慕你到点走人。建议：别硬转管理，你的收入天花板可以靠‘专家+个人品牌’突破（比如出课程、写书、做顾问）。但注意，别变成孤岛，适当学点向上汇报，否则功劳容易被抢。你的护城河是深度，不是宽度。”" };
                if (管理 >= 专家 + 2) return { type: "管理型", text: "“你天生是个‘包工头’——喜欢分活、催活、收活。让你埋头钻研你会疯，你喜欢的是调动资源、搞定人的成就感。但小心：管理不是官威，是服务+背锅。你可能要面对：下属不听话、上级拍脑袋、跨部门扯皮。建议：30岁前先做两年专家，懂业务的管理者才服众。如果直接空降管理，容易被下属联手做掉。另外，管理岗的出路不只是往上爬，也可以是成为优秀的项目经理或创业。你的优势是整合力，别浪费。”" };
                return { type: "混合型", text: "“你是职场两栖动物——能干活也能带人，但别两头都半吊子。你最合适的路径是：技术团队Leader或项目负责人，既懂业务又能协调。注意别陷入‘谁弱就替谁做’的陷阱，要学会授权。建议：前五年偏专，后五年偏管，尽量待在有技术门槛的行业（互联网、医药、工程等），这样你的专家底子能一直保值。如果去了纯管理岗，你的技术武器容易生锈。你的目标是‘懂管理的专家’，而不是‘不懂业务的经理’。”" };
            }
        },
        // 3. 副业方向
        {
            id: 3,
            title: "💸 如果我今年想搞副业，哪个方向最容易成功？",
            questions: [
                { text: "Q1：你的业余时间最喜欢做什么？", opts: [{ label: "刷文字类内容或自己写东西", scores: { 写: 3 } }, { label: "刷图片/视频或自己拍/剪", scores: { 拍: 3 } }, { label: "整理房间、做计划、收纳", scores: { 整: 3 } }, { label: "和朋友聊天、混群、帮人解决问题", scores: { 聊: 3 } }] },
                { text: "Q2：朋友最常因为什么夸你？", opts: [{ label: "你文笔好/会讲故事", scores: { 写: 2 } }, { label: "你审美不错/拍照好看", scores: { 拍: 2 } }, { label: "你好有条理/什么东西都能找到", scores: { 整: 2 } }, { label: "你好会聊天/情商高", scores: { 聊: 2 } }] },
                { text: "Q3：你手上最拿得出手的“作品”是什么？", opts: [{ label: "文章、笔记、文案", scores: { 写: 2 } }, { label: "照片、视频、设计图", scores: { 拍: 2 } }, { label: "日程模板、收纳方案", scores: { 整: 2 } }, { label: "聊天截图、社群活跃记录", scores: { 聊: 2 } }, { label: "没有", scores: {} }] },
                { text: "Q4：如果有人付费请你做一件事，你最有信心做哪件？", opts: [{ label: "写一篇产品文案/读后感", scores: { 写: 3 } }, { label: "拍一组照片/剪一个短视频", scores: { 拍: 3 } }, { label: "帮人整理电脑文件/房间/时间表", scores: { 整: 3 } }, { label: "当树洞倾听、做情感/职场咨询", scores: { 聊: 3 } }] },
                { text: "Q5：你更愿意通过什么样的方式变现？", opts: [{ label: "接单（稿费、文案费）", scores: { 写: 1, 拍: 1 } }, { label: "做账号（广告、带货）", scores: { 写: 2, 拍: 2 } }, { label: "卖服务（咨询、规划、陪跑）", scores: { 整: 2, 聊: 2 } }, { label: "卖产品（模板、电子书）", scores: { 整: 2, 写: 1 } }] },
                { text: "Q6：你现在的“执行力”水平是？", opts: [{ label: "能坚持更新，不怕初期没人看", scores: { 写: 2, 拍: 2, 整: 2, 聊: 2 } }, { label: "需要有人催或正反馈才能坚持", scores: {} }, { label: "三分钟热度，容易放弃", scores: { 写: -1, 拍: -1, 整: -1, 聊: -1 } }] }
            ],
            compute: (answers) => {
                let score = { 写: 0, 拍: 0, 整: 0, 聊: 0 };
                answers.forEach(a => { for (let k in a) if (score[k] !== undefined) score[k] += a[k]; });
                let total = Object.values(score).reduce((s, v) => s + v, 0);
                let hasNegative = answers.some(a => a['写'] === -1);
                if (total < 3 || hasNegative) return { type: "先别搞副业", text: "“你现在不太适合搞副业，不是能力问题，是状态问题。你可能主业太累、或者自制力像纸糊的。强行搞副业只会让你更焦虑。建议：先存一笔‘副业启动金’（比如500块），然后报一个最便宜的体验课（9.9元那种），试一周。如果连这点都坚持不下去，就先专注主业和休息。副业是锦上添花，不是雪中送炭。你连6道题都懒得认真答？那副业也懒得找你。”" };
                let maxKey = Object.keys(score).reduce((a, b) => score[a] >= score[b] ? a : b, '写');
                const map = { 写: "写东西", 拍: "拍照/设计", 整: "整理/规划", 聊: "聊天/社交" };
                const adv = {

                if (total < 5) return { type: "重新评估", text: "“你未来一年的关键词还不是‘突破、稳定、转型’中的任何一个，因为你可能正处在‘迷茫期’或‘休整期’。建议：不要逼自己立刻选方向。先花一个月做三件事：1）记录每天工作情绪，找出哪些事让你开心、哪些让你痛苦；2）找三个人（不同行业、不同年龄）聊他们的工作状态；3）做一次职业性格测试（MBTI、霍兰德等）。一个月后再来测一次这道题。你不需要马上决定，但你需要开始收集信息。方向不清的时候就慢下来，总比在泥坑里狂奔要好。”" };
                if (突破 >= 稳定 && 突破 >= 转型) return { type: "突破", text: "“明年你的关键词是：别怂，往上爬。你已经有了一定的积累，瓶颈不在能力，而在‘要不要再拼一把’。建议：主动争取一个难啃的项目、向老板提出晋升申请、或者挑战更高的KPI。你需要的是曝光度和勋章。别怕犯错，你现在犯错的成本还能承受。具体动作：Q1结束时拿出一个超出预期的成果，然后用这个成果去谈加薪或升职。如果公司不给你，就带着成果跳槽。你的赛道远没到头，别在还有力气冲刺的时候散步。”" };
                if (稳定 >= 突破 && 稳定 >= 转型) return { type: "稳定", text: "“明年你的关键词是：守城。你已经到了一个相对舒适的位置或者正处于生活变动期（买房、结婚、育儿等），求稳比求快更明智。建议：不要轻易跳槽或转行，先把现有的工作做深做细，保证不出大错。同时可以优化效率，腾出时间给自己或家庭。但稳定不等于停滞，你可以用20%的精力学一个与现在工作相关的边缘技能（比如Excel高级功能、汇报技巧），既不折腾又能防身。记住：稳定不是躺平，是把现有阵地打造得更牢固。等外界的风浪过去了，你再考虑进攻。”" };
                return { type: "转型", text: "“明年是你的换跑道之年。你现在的行业/岗位已经到了天花板或者让你痛苦很久了。别再骗自己‘再忍忍就习惯了’。建议：接下来三个月，花50%的业余时间调研新方向——访谈至少5个你想转行的人、上完一门入门课、做一个小项目试手。然后投10份简历测试水温。转型不一定一次到位，可以‘先内部转岗’或‘副业试水再全职’。别裸辞，除非你存款能撑一年。你现在的痛苦不是你的错，是错配。换个地方，你可能就活了。但换之前，想清楚：你是逃避困难，还是追求真正适合的？”" };
            }
        }
    ];

    // 渲染全部模块
    function renderAllModules() {
        const container = document.getElementById('modulesContainer');
        container.innerHTML = '';
        modules.forEach(mod => {
            const card = document.createElement('div');
            card.className = 'test-card';
            card.innerHTML = `
                <div class="card-header">
                    <h2>${mod.title}</h2>
                    <div class="badge-module"><i class="fas fa-dice-d6"></i> 毒舌解盘</div>
                </div>
                <div class="questions-area" id="module-${mod.id}-area"></div>
            `;
            container.appendChild(card);
            const area = card.querySelector(`.questions-area`);
            let html = '';
            mod.questions.forEach((q, qidx) => {
                html += `<div class="q-item" data-qidx="${qidx}">
                            <div class="q-text"><i class="fas fa-question-circle"></i> ${q.text}</div>
                            <div class="options-group" data-qidx="${qidx}">`;
                q.opts.forEach((opt, oidx) => {
                    html += `<label class="opt-label" data-val='${JSON.stringify(opt.scores)}'>
                                <input type="radio" name="q${mod.id}_${qidx}" value="${oidx}"> ${opt.label}
                            </label>`;
                });
                html += `</div></div>`;
            });
            html += `<button class="action-btn" data-module="${mod.id}"><i class="fas fa-chart-simple"></i> 揭晓毒舌真相</button>
                     <div class="result-box" style="display:none;"></div>`;
            area.innerHTML = html;

            // 选项高亮
            area.querySelectorAll('.opt-label').forEach(lbl => {
                lbl.addEventListener('click', () => {
                    const radio = lbl.querySelector('input');
                    if (radio) radio.checked = true;
                    const parentGroup = lbl.closest('.options-group');
                    parentGroup.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                    lbl.classList.add('selected');
                });
            });

            const btn = area.querySelector('.action-btn');
            const resultDiv = area.querySelector('.result-box');
            btn.addEventListener('click', () => {
                let answers = [];
                let missing = false;
                mod.questions.forEach((_, qidx) => {
                    const selected = area.querySelector(`input[name="q${mod.id}_${qidx}"]:checked`);
                    if (!selected) { missing = true; return; }
                    const parentLabel = selected.closest('.opt-label');
                    const scoresRaw = parentLabel.getAttribute('data-val');
                    const scores = JSON.parse(scoresRaw);
                    answers.push(scores);
                });
                if (missing) {
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `<i class="fas fa-hand-peace"></i> 请先把所有问题选完，别偷懒～ 毒舌虽毒，但需要你的诚意。`;
                    return;
                }
                const res = mod.compute(answers);
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<i class="fas fa-crystal-ball"></i> <strong>${res.type}</strong><br>${res.text}`;
            });
        });
    }

    window.onload = renderAllModules;
</script>
</body>
</html>
