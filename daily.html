<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>每日一占 · 遇事不决灵占馆</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0718;
            font-family: 'Inter', 'Space Grotesk', system-ui, sans-serif;
            color: #f0eefc;
            line-height: 1.4;
            padding: 2rem 1rem;
        }
        /* 背景纹理 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110, 70, 200, 0.15), transparent 60%),
                        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        /* 头部 */
        .hero {
            text-align: center;
            margin-bottom: 2rem;
            background: rgba(15, 12, 32, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 100, 220, 0.3);
        }
        .hero h1 {
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            background: linear-gradient(135deg, #FFFFFF, #D9B4FF, #FF87C8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }
        .hero .badge-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .badge {
            background: rgba(255, 120, 210, 0.18);
            padding: 0.3rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            border: 0.5px solid rgba(255, 130, 200, 0.5);
        }
        .slogan {
            font-size: 0.8rem;
            color: #cbbaff;
        }
        /* 测试卡片 */
        .daily-block {
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.8rem;
            border-left: 5px solid #ff77c6;
            transition: 0.2s;
        }
        .daily-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #ffd6f0;
        }
        .question-item {
            margin-bottom: 1.2rem;
            background: rgba(0,0,0,0.25);
            border-radius: 1rem;
            padding: 0.8rem;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 0.3rem;
        }
        .opt-label {
            background: rgba(255,255,240,0.07);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }
        .opt-label.selected {
            background: #bf5eff40;
            border-color: #e27eff;
            color: white;
        }
        input[type="radio"], input[type="number"], select {
            accent-color: #d96eff;
        }
        .zodiac-select, .number-input {
            background: #1e183a;
            border: 1px solid #b77eff;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            color: white;
            font-size: 0.9rem;
            width: auto;
        }
        button {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(0.97);
        }
        .submit-report-btn {
            width: 100%;
            max-width: 300px;
            margin: 1rem auto;
            display: block;
            font-size: 1.1rem;
        }
        .report-area {
            background: rgba(0,0,0,0.55);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-top: 2rem;
            border: 1px solid #ff93d0;
        }
        .result-chunk {
            margin-bottom: 1.2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #6b4c9e;
        }
        .result-chunk:last-child {
            border-bottom: none;
        }
        .result-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffbcfa;
            margin-bottom: 0.5rem;
        }
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #6b62a0;
            margin-top: 2rem;
        }
        @media (max-width: 700px) {
            .container { padding: 0 0.5rem; }
            .daily-block { padding: 1rem; }
        }
        .lingxi-mini {
            text-align: center;
            margin: 1rem 0;
        }
        .lingxi-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid #bd8eff;
            border-radius: 80px;
            padding: 0.5rem 1.5rem;
            display: inline-flex;
            gap: 0.5rem;
            cursor: pointer;
        }
        .back-home { display: inline-block; margin-bottom: 1rem; background: rgba(255,255,255,0.1); padding: 0.4rem 1rem; border-radius: 40px; text-decoration: none; color: #ffbbf0; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="hero">
        <h1>🌞 每日一占 · 毒舌改运 🌞</h1>
        <div class="badge-group">
            <span class="badge"><i class="fas fa-feng-shui"></i> 玄学风水专业度</span>
            <span class="badge"><i class="fas fa-brain"></i> 正统心理学底层逻辑</span>
            <span class="badge"><i class="fas fa-bolt"></i> 极致年轻化潮流玩法</span>
        </div>
        <div class="slogan"><i class="fas fa-crystal-ball"></i> 拒绝土味·拒绝废话·犀利戳心·灵魂共鸣·不贩卖焦虑·只给正向指引</div>
    </div>

    <!-- 所有10个模块动态生成，但为了方便维护直接写HTML+JS渲染 -->
    <div id="dailyFormContainer"></div>
    <div class="lingxi-mini">
        <div class="lingxi-btn" id="lingxiSurpriseBtn"><i class="fas fa-gem"></i> 灵犀测 · 一秒戳心</div>
        <div id="lingxiTip" style="font-size:0.8rem; margin-top:8px;">⚡ 戳一下，接收灵魂共鸣短句</div>
    </div>
    <button class="submit-report-btn" id="genFullReportBtn"><i class="fas fa-chart-simple"></i> 生成今日完整运势报告 ✨</button>
    <div id="fullReportArea" class="report-area" style="display: none;"></div>
    <div class="footer">🌙 遇事不决灵占馆 · 每日一占 | 毒舌但有用，看完别打我</div>
</div>

<script>
    // ---------- 1. 幸运色逻辑 ----------
    function getLuckyColor() {
        // 收集6题选项值
        let scores = { "红色":0, "黄色":0, "蓝色":0, "绿色":0, "紫色":0, "粉色":0, "白色":0, "黑色":0 };
        for(let i=0;i<6;i++){
            let selected = document.querySelector(`input[name="color_q${i}"]:checked`);
            if(selected) scores[selected.value] += 1;
        }
        let priorityOrder = ["红色","黄色","蓝色","绿色","紫色","粉色","白色","黑色"];
        let maxColor = priorityOrder.find(c => scores[c] === Math.max(...Object.values(scores)));
        return maxColor || "黑色";
    }
    const colorTexts = {
        "红色": "“你今天像一只愤怒的番茄，又红又燥。适合去吵架（不是），适合推进拖了三个月的事。把微信头像换成红色感叹号，效率+50%。注意：别对无辜的人喷火，否则晚上你会后悔得想把自己凉拌。”",
        "黄色": "“你是今天的小太阳，但小心刺眼。适合发‘哈哈哈哈哈’的朋友圈，会吸引同样沙雕的贵人。禁忌：别在下午3点做重大决定，那时你的智商和蜜蜂差不多。如果非要决定，先吃块糖。”",
        "蓝色": "“你今天是一台冷静的空调，但容易把自己冻着。适合回邮件、列清单、撕逼（如果必须）。禁忌：别安慰别人，你的‘理性分析’会让人更想哭。建议对镜子说一句‘关我屁事’，你会爽到。”",
        "绿色": "“你今天像个行走的盆栽，佛系又养生。适合摸鱼（不是），适合去公园发呆。如果非要工作，就做那些‘不用动脑子’的杂活。晚上吃一盘青菜，你会觉得世界还能救。警告：别喝奶茶，会打破你的仙气。”",
        "紫色": "“你今天神秘得像没信号的WiFi——看着有，连不上。适合一个人待着、写日记、删照片。如果有人问你‘怎么了’，你就说‘我在修仙’。晚上适合看烂片，别动脑子，动了你就输了。”",
        "粉色": "“你今天是一颗棉花糖，软得谁都想捏一把。适合撒娇、收快递、点一杯全糖奶茶。但警告：你今天容易恋爱脑，别给前任发消息，否则明天你恨不得剁手。如果非要发，先发给我，我骂醒你。”",
        "白色": "“你今天干净得像一张A4纸，但也无聊得像一张A4纸。适合早起、整理桌面、拒绝所有人的饭局。你需要的不是好运，是一个能让你笑出来的傻逼朋友。如果找不到，去看土味视频。”",
        "黑色": "“你今天是一件黑色高领毛衣——很酷，但也很装。适合怼人、删好友、写一篇阴阳怪气的微博。能量提示：下午4点你会突然很丧，去吃一块黑巧克力，别喝酒。如果还是丧，就睡一觉，明天再做人。”"
    };

    // 2. 情绪陷阱
    function getTrapType() {
        let trapScores = { "焦虑":0, "讨好":0, "灾难化":0, "完美主义":0 };
        // Q1 焦虑
        if(document.querySelector('input[name="trap0"]:checked')?.value === "yes") trapScores["焦虑"] += 1;
        // Q2 Q4 讨好
        if(document.querySelector('input[name="trap1"]:checked')?.value === "yes") trapScores["讨好"] += 1;
        if(document.querySelector('input[name="trap3"]:checked')?.value === "yes") trapScores["讨好"] += 1;
        // Q3 灾难化
        if(document.querySelector('input[name="trap2"]:checked')?.value === "yes") trapScores["灾难化"] += 1;
        // Q5 完美主义
        if(document.querySelector('input[name="trap4"]:checked')?.value === "yes") trapScores["完美主义"] += 1;
        let total = Object.values(trapScores).reduce((a,b)=>a+b,0);
        if(total === 0) return "神仙";
        let order = ["焦虑","讨好","灾难化","完美主义"];
        let maxType = order.find(t => trapScores[t] === Math.max(...Object.values(trapScores)));
        return maxType;
    }
    const trapTexts = {
        "焦虑": "“你活像一部没信号的手机——一直在搜索，永远连不上。今天放下手机去拉屎，拉完再想。如果还焦虑，就把‘烦死了’换成‘然后呢’，问自己三次，你就发现事情没那么大。建议设置一个‘焦虑闹钟’：每次焦虑只允许自己烦3分钟。”",
        "讨好": "“你把自己活成了‘好的呢’复读机。今天试着说一次‘我不要’，你会发现天塌不下来，只会塌你的假人设。建议把手机壁纸换成‘关我屁事’。如果实在不敢拒绝，就先拖延。”",
        "灾难化": "“你脑子里在拍灾难片，可惜你不是导演。事情有80%比你想的简单，剩下20%你控制不了。去洗把脸，然后对自己说‘最坏也不过是…’——说出口你就觉得好笑了。”",
        "完美主义": "“你想把每件事做成米其林，但今天你只有泡面食材。允许自己交一份‘60分卷子’，你会发现没人扣你分。今天做任何事前先喊‘老子不完美，咋了？’然后直接开干。”",
        "神仙": "“恭喜你，今天你的情绪稳得像一只老乌龟。你没有任何明显的情绪陷阱。继续保持。但小心：太稳了容易无聊，建议你今天主动挑一件小事搞砸它（比如故意把咖啡洒在桌上），体验一下失控的快乐。”"
    };

    // 3. 事情进展
    function getProgressCard() {
        let total = 0;
        for(let i=0;i<6;i++){
            let selected = document.querySelector(`input[name="prog${i}"]:checked`);
            if(selected) total += parseInt(selected.value);
        }
        if(total <= 3) return "迷雾牌";
        if(total <= 6) return "潮汐牌";
        if(total <= 9) return "星尘牌";
        return "旭日牌";
    }
    const progressTexts = {
        "旭日牌": "“会！而且比你想象的快。下午2点前会有明确信号（消息、电话、或者突然的灵感）。但记住：别反复检查，越盯越慢。建议：把手机关静音放抽屉里，1小时后再看，惊喜会翻倍。”",
        "星尘牌": "“进展会超出预期，但需要你主动推一次。比如：问一句‘还有没有别的可能？’或补一份资料。别等，等就没星星了。你今天的一个小动作，会在傍晚时发酵成好消息。动手吧，懒鬼。”",
        "潮汐牌": "“表面没动静，暗流已经在推了。晚上8点后你会得到一个线索。建议你现在就去干别的事，比如刷鞋、给绿萝浇水。不要反复刷那个对话框，你今天刷不出结果，但明天可以。”",
        "迷雾牌": "“今天不是答案日。但你会明白‘原来这件事没那么重要’。如果非要行动，只做最轻的一步（发个‘在吗’或查个基础资料）。别投入情绪。建议：把这件事写下来，明天早上再看。”"
    };

    // 4. 出击/等待
    function getAttackWait() {
        let attackScore = 0, waitScore = 0;
        for(let i=0;i<6;i++){
            let selected = document.querySelector(`input[name="aw${i}"]:checked`);
            if(selected){
                let [a,w] = selected.value.split(',').map(Number);
                attackScore += a;
                waitScore += w;
            }
        }
        return attackScore > waitScore ? "出击" : "等待";
    }
    const awTexts = {
        "出击": "“你今天像一把刚磨好的刀，别放在柜子里生锈。适合在上午10-11点做‘需要勇气’的事（发消息、约人、提方案）。禁忌：别在午饭前做重大决定，饿着肚子容易乱咬人。出击口诀：‘先做再想，错了就认，反正没人记得你昨天干了啥。’ 现在就去，别刷手机了。”",
        "等待": "“你今天是一只警觉的猫头鹰，但别白天扑腾。任何冲动决定都会在傍晚让你后悔得想扇自己。建议你只做‘收集信息’的事（看资料、听八卦、列清单），晚饭后再判断。等待不是偷懒，是让子弹飞一会儿。”"
    };

    // 5. 星座贵人 (元素分组)
    const zodiacMap = {
        "白羊座":{ element:"火", same:"狮子座", complement:"天秤座" },
        "狮子座":{ element:"火", same:"射手座", complement:"水瓶座" },
        "射手座":{ element:"火", same:"白羊座", complement:"双子座" },
        "金牛座":{ element:"土", same:"处女座", complement:"巨蟹座" },
        "处女座":{ element:"土", same:"摩羯座", complement:"双鱼座" },
        "摩羯座":{ element:"土", same:"金牛座", complement:"天蝎座" },
        "双子座":{ element:"风", same:"天秤座", complement:"射手座" },
        "天秤座":{ element:"风", same:"水瓶座", complement:"白羊座" },
        "水瓶座":{ element:"风", same:"双子座", complement:"狮子座" },
        "巨蟹座":{ element:"水", same:"天蝎座", complement:"摩羯座" },
        "天蝎座":{ element:"水", same:"双鱼座", complement:"金牛座" },
        "双鱼座":{ element:"水", same:"巨蟹座", complement:"处女座" }
    };
    function getZodiacAdvice(zodiac) {
        let info = zodiacMap[zodiac];
        if(!info) return "✨ 选择星座后查看贵人";
        let same = info.same, comp = info.complement;
        return `同元素贵人（${same}）：“和你${zodiac.includes('火')?'一样火':zodiac.includes('土')?'一样土':zodiac.includes('风')?'一样飘忽':'一样水'}的${same}，今天会点燃/稳住你的能量。主动聊一句，运气+30%。”<br><br>互补元素贵人（${comp}）：“和你截然相反的${comp}，能帮你刹车/助推。今天如果有个${comp}的人给你建议，别烦，听进去。犹豫不决时找他们聊聊。”`;
    }

    // 6. 超常发挥
    function getTalentArea() {
        let scores = { "工作":0, "社交":0, "创意":0, "学习":0, "运动":0 };
        for(let i=0;i<5;i++){
            let selected = document.querySelector(`input[name="talent${i}"]:checked`);
            if(selected){
                let val = selected.value;
                let pairs = JSON.parse(val);
                for(let j=0;j<pairs.length;j+=2){
                    scores[pairs[j]] += pairs[j+1];
                }
            }
        }
        let order = ["创意","社交","工作","学习","运动"];
        let maxArea = order.find(a => scores[a] === Math.max(...Object.values(scores)));
        return maxArea;
    }
    const talentTexts = {
        "工作": "“你今天是一只上了发条的工作驴，效率高得吓人。适合处理积压任务、做表格、回邮件。你会被至少一个人夸‘靠谱’。但警告：别顺手接别人的活，你今天太猛容易变傻。建议：每做完一件事就站起来扭两下。”",
        "社交": "“你今天嘴开了光，说什么都招人喜欢。适合组局、约饭、发朋友圈。你的一句无心话会帮到某个需要的人。注意：别因为太嗨就答应不想去的局，你的‘好啊’说得太快。建议：今天多听少说，效果翻倍。”",
        "创意": "“你今天脑洞开得像被门夹过——又痛又爽。灵感像喝了红牛的兔子。适合写东西、拍视频、画图。但警告：别在下午3点前做执行，先记下来，晚上再筛选。建议：把想到的疯狂主意发给一个沙雕朋友。”",
        "学习": "“你今天脑子像新买的硬盘——又空又能装。适合看教程、听播客、刷题、背单词。平时看不懂的今天突然懂了。禁忌：别一口气学太多，你会把自己撑吐。建议：每学25分钟就刷5分钟土味视频。”",
        "运动": "“你今天身体里住着一头野兽，不动就难受。适合跑步、打球、爬楼梯。你会发现自己体力比想象中好。注意：别一开始就冲太猛，否则后半场像条死狗。建议：运动前先热身3分钟。”"
    };

    // 7. 心情数字
    const moodTexts = {
        1: "“整理手机相册。删掉那些拍糊了的、重复的、还有前任的截图。删完你会觉得人生清爽了20%。建议：边删边骂‘这拍的什么玩意儿’，效果加倍。”",

    // 星座预览
    const zodiacSelect = document.getElementById("zodiacSelect");
    const zodiacPreview = document.getElementById("zodiacPreview");
    function updateZodiacPreview() { zodiacPreview.innerHTML = getZodiacAdvice(zodiacSelect.value); }
    zodiacSelect.addEventListener("change", updateZodiacPreview);
    updateZodiacPreview();

    // 抽签
    document.getElementById("drawSignBtn").addEventListener("click",()=>{
        let rand = Math.floor(Math.random() * signs.length);
        document.getElementById("signResult").innerHTML = signs[rand];
    });

    // 生成完整报告
    document.getElementById("genFullReportBtn").addEventListener("click",()=>{
        // 检查是否所有必选都选了 (简单提醒)
        let allRadios = document.querySelectorAll('input[type="radio"]');
        let unanswered = Array.from(allRadios).some(r => !r.checked && r.name && !r.name.includes('detail')? false : true); // 简化不强制全选，但最好提醒
        if(!confirm("确认所有题目都选好了吗？如果漏选了部分结果可能不完整，建议返回检查。确定生成？")) return;
        let luckyColor = getLuckyColor();
        let trap = getTrapType();
        let progress = getProgressCard();
        let aw = getAttackWait();
        let zodiac = zodiacSelect.value;
        let talent = getTalentArea();
        let moodNum = parseInt(document.getElementById("moodNumber").value);
        let sign = document.getElementById("signResult").innerText.includes("点击抽签") ? "未抽签，快去摇一签吧" : document.getElementById("signResult").innerText;
        let foodType = getFoodType();
        let detailType = getDetailType();

        let reportHtml = `
            <div class="result-chunk"><div class="result-title"><i class="fas fa-palette"></i> 幸运能量色 · ${luckyColor}</div><div>${colorTexts[luckyColor]}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-brain"></i> 情绪陷阱 · ${trap}</div><div>${trapTexts[trap]}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-chart-line"></i> 事情进展 · ${progress}</div><div>${progressTexts[progress]}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-crosshairs"></i> 今日策略 · ${aw}</div><div>${awTexts[aw]}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-star"></i> 星座贵人 · ${zodiac}</div><div>${getZodiacAdvice(zodiac)}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-rocket"></i> 超常发挥 · ${talent}</div><div>${talentTexts[talent]}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-hand-peace"></i> 心情行动数字 · ${moodNum}</div><div>${moodTexts[moodNum] || moodTexts[5]}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-scroll"></i> 能量签语</div><div>${sign}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-utensils"></i> 饮食运势 · ${foodType}</div><div>${foodTexts[foodType]}</div></div>
            <div class="result-chunk"><div class="result-title"><i class="fas fa-walking"></i> 出门细节 · ${detailType}</div><div>${detailTexts[detailType]}</div></div>
        `;
        let reportDiv = document.getElementById("fullReportArea");
        reportDiv.innerHTML = reportHtml;
        reportDiv.style.display = "block";
        reportDiv.scrollIntoView({ behavior: "smooth" });
    });

    // 灵犀测彩蛋
    const lingxiMsgs = ["🌙 别让焦虑偷走当下的灵感，你本自具足。","💫 你无须成为别人，你的独特就是最好的风水。","✨ 每一次选择都在塑造你，记得选择温柔待己。","🌊 运势像潮汐，低谷时沉淀，涨潮时绽放。","🔥 你内心那团火，比任何星盘都亮。"];
    document.getElementById("lingxiSurpriseBtn").addEventListener("click",()=>{
        let r = lingxiMsgs[Math.floor(Math.random()*lingxiMsgs.length)];
        document.getElementById("lingxiTip").innerHTML = `✨ ${r} ✨`;
        setTimeout(()=>{ document.getElementById("lingxiTip").innerHTML = "⚡ 戳一下，接收灵魂共鸣短句"; }, 3500);
    });
</script>
</body>
</html>
