<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>日常占卜 · 幸运能量色</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', sans-serif;
            color: #f0eefc;
            padding: 2rem 1rem;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110,70,200,0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-home {
            display: inline-block;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            color: #ffbbf0;
            font-size: 0.8rem;
        }
        .card {
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border-left: 5px solid #ff77c6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffd6f0;
        }
        .question-item {
            margin-bottom: 1.5rem;
            background: rgba(0,0,0,0.25);
            border-radius: 1rem;
            padding: 1rem;
        }
        .question-text { font-weight: 600; margin-bottom: 0.8rem; }
        .options-group { display: flex; flex-wrap: wrap; gap: 0.6rem; }
        .opt-label {
            background: rgba(255,255,240,0.07);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }
        .opt-label.selected {
            background: #bf5eff40;
            border-color: #e27eff;
            color: white;
        }
        input[type="radio"] { display: none; }
        button {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            width: 100%;
        }
        .result {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.45);
            border-radius: 1.5rem;
            padding: 1rem;
            border-left: 4px solid #ff7bc2;
            display: none;
        }
        /* 分享区域 */
        .share-section {
            margin-top: 1.5rem;
            text-align: center;
            display: none;
        }
        .share-btn {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            color: #2d1b4e;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255,120,200,0.3);
        }
        .share-btn:hover { transform: scale(1.02); }
        .share-tip {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #ffd966;
            animation: float 1.5s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        /* 赞赏区域 */
        .reward-section {
            margin-top: 1.5rem;
            text-align: center;
            border-top: 1px dashed rgba(255,135,200,0.4);
            padding-top: 1rem;
            display: none;
        }
        .reward-title {
            font-size: 0.9rem;
            color: #cbb1ff;
            margin-bottom: 0.8rem;
        }
        .reward-codes {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .reward-item {
            text-align: center;
            font-size: 0.7rem;
            color: #cbb1ff;
        }
        .reward-item img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: white;
            padding: 5px;
            margin-bottom: 4px;
        }
        /* 分享图片生成容器（隐藏） */
        .share-image-container {
            position: fixed;
            left: -9999px;
            top: 0;
            width: 500px;
            background: linear-gradient(135deg, #1e1a3a, #0c0a20);
            border-radius: 32px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            border: 1px solid #ff77c6;
            font-family: 'Inter', sans-serif;
        }
        /* 弹窗模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            background: transparent;
            border-radius: 32px;
            overflow: auto;
            text-align: center;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .close-tip {
            margin-top: 1rem;
            color: #ffd6f0;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 40px;
        }
        /* 撒花特效 */
        @keyframes confetti {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(100px) rotate(720deg); }
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff77c6;
            pointer-events: none;
            z-index: 10001;
            animation: confetti 0.8s ease-out forwards;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #6b62a0; margin-top: 2rem; }
        @media (max-width: 680px) {
            .reward-item img { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>🎨 今天你的“幸运能量色”是什么？</h1>
        <div id="questionsContainer"></div>
        <button id="submitBtn">✨ 查看幸运色 ✨</button>
        <div id="resultArea" class="result"></div>
        <div id="shareSection" class="share-section">
            <button id="shareBtn" class="share-btn"><i class="fas fa-camera"></i> 生成分享图片</button>
            <div class="share-tip">✨ 点击生成图片，长按保存分享 ✨</div>
        </div>
        <div id="rewardSection" class="reward-section">
            <div class="reward-title">🌸 如果觉得不错，可以赏我一点辛苦费~ 🌸</div>
            <div class="reward-codes">
                <div class="reward-item"><img src="/picture/weixin.jpg" alt="微信赞赏码" onerror="this.src='https://placehold.co/80x80/2a1e45/ffb3e6?text=微信'"><br>微信赞赏</div>
                <div class="reward-item"><img src="/picture/zhifubao.jpg" alt="支付宝赞赏码" onerror="this.src='https://placehold.co/80x80/2a1e45/ffb3e6?text=支付宝'"><br>支付宝赞赏</div>
            </div>
        </div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 每日一占</div>
</div>

<!-- 隐藏的分享图片生成容器 -->
<div id="shareImageContainer" class="share-image-container"></div>
<!-- 模态框 -->
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <img id="modalImage" src="" alt="分享图片">
        <div class="close-tip">✨ 长按图片保存，点击空白处关闭 ✨</div>
    </div>
</div>

<script>
    // ================= 题目配置（请根据不同问题替换） =================
    const questions = [
        { text: "今天起床后第一个念头是什么？", opts: ["又要搬砖", "今天可能有好事", "啥也没想，像具尸体"], colors: ["红色", "黄色", "黑色"] },
        { text: "你今天最不想面对的事情是？", opts: ["开会/回消息", "社交/假笑", "做决定"], colors: ["蓝色", "绿色", "紫色"] },
        { text: "选一个emoji代表你现在的心情？", opts: ["😤（生气）", "😌（放松）", "😑（无感）"], colors: ["红色", "绿色", "黑色"] },
        { text: "你现在的咖啡/奶茶进度？", opts: ["刚喝完", "还没买", "今天不喝"], colors: ["黄色", "蓝色", "白色"] },
        { text: "如果今天必须做一件无聊的事，你选？", opts: ["整理表格", "排队", "听人吹牛"], colors: ["蓝色", "黑色", "红色"] },
        { text: "你今天的袜子颜色？", opts: ["深色", "亮色", "没穿"], colors: ["黑色", "黄色", "粉色"] }
    ];
    let answers = new Array(questions.length).fill(null);
    let currentResultColor = "";
    let currentResultText = "";

    function render() {
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-item">
                        <div class="question-text">${q.text}</div>
                        <div class="options-group" data-qidx="${idx}">`;
            q.opts.forEach((opt, oidx) => {
                let selectedClass = (answers[idx] === oidx) ? 'selected' : '';
                html += `<label class="opt-label ${selectedClass}" data-oidx="${oidx}">${opt}<input type="radio" name="q${idx}" value="${oidx}"></label>`;
            });
            html += `</div></div>`;
        });
        document.getElementById("questionsContainer").innerHTML = html;
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.opt-label').forEach(label => {
            label.addEventListener('click', function(e) {
                let group = this.closest('.options-group');
                let qidx = group.dataset.qidx;
                let oidx = this.dataset.oidx;
                answers[qidx] = parseInt(oidx);
                group.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                let radio = this.querySelector('input');
                if (radio) radio.checked = true;
            });
        });
    }

    function getResult() {
        let scores = { "红色":0, "黄色":0, "蓝色":0, "绿色":0, "紫色":0, "粉色":0, "白色":0, "黑色":0 };
        for (let i = 0; i < questions.length; i++) {
            let idx = answers[i];
            if (idx === null) return null;
            let color = questions[i].colors[idx];
            scores[color] += 1;
        }
        let priority = ["红色","黄色","蓝色","绿色","紫色","粉色","白色","黑色"];
        let maxScore = -1, bestColor = "黑色";
        for (let c of priority) {
            if (scores[c] > maxScore) {
                maxScore = scores[c];
                bestColor = c;
            }
        }
        return bestColor;
    }

    const resultTexts = {
        "红色": "“你今天像一只愤怒的番茄，又红又燥。适合去吵架（不是），适合推进拖了三个月的事。把微信头像换成红色感叹号，效率+50%。注意：别对无辜的人喷火，否则晚上你会后悔得想把自己凉拌。”",
        "黄色": "“你是今天的小太阳，但小心刺眼。适合发‘哈哈哈哈哈’的朋友圈，会吸引同样沙雕的贵人。禁忌：别在下午3点做重大决定，那时你的智商和蜜蜂差不多。如果非要决定，先吃块糖。”",
        "蓝色": "“你今天是一台冷静的空调，但容易把自己冻着。适合回邮件、列清单、撕逼（如果必须）。禁忌：别安慰别人，你的‘理性分析’会让人更想哭。建议对镜子说一句‘关我屁事’，你会爽到。”",
        "绿色": "“你今天像个行走的盆栽，佛系又养生。适合摸鱼（不是），适合去公园发呆。如果非要工作，就做那些‘不用动脑子’的杂活。晚上吃一盘青菜，你会觉得世界还能救。警告：别喝奶茶，会打破你的仙气。”",
        "紫色": "“你今天神秘得像没信号的WiFi——看着有，连不上。适合一个人待着、写日记、删照片。如果有人问你‘怎么了’，你就说‘我在修仙’。晚上适合看烂片，别动脑子，动了你就输了。”",
        "粉色": "“你今天是一颗棉花糖，软得谁都想捏一把。适合撒娇、收快递、点一杯全糖奶茶。但警告：你今天容易恋爱脑，别给前任发消息，否则明天你恨不得剁手。如果非要发，先发给我，我骂醒你。”",
        "白色": "“你今天干净得像一张A4纸，但也无聊得像一张A4纸。适合早起、整理桌面、拒绝所有人的饭局。你需要的不是好运，是一个能让你笑出来的傻逼朋友。如果找不到，去看土味视频。”",
        "黑色": "“你今天是一件黑色高领毛衣——很酷，但也很装。适合怼人、删好友、写一篇阴阳怪气的微博。能量提示：下午4点你会突然很丧，去吃一块黑巧克力，别喝酒。如果还是丧，就睡一觉，明天再做人。”"
    };

    // 撒花特效
    function startConfetti() {
        for (let i = 0; i < 50; i++) {
            let conf = document.createElement("div");
            conf.className = "confetti";
            conf.style.left = Math.random() * window.innerWidth + "px";
            conf.style.top = "-20px";
            conf.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 800);
        }
    }

    // 生成分享图片（不下载，只弹窗）
    async function generateShareImage(moduleTitle, resultColor, resultDetail) {
        startConfetti(); // 撒花
        const container = document.getElementById("shareImageContainer");
        const today = new Date().toLocaleDateString('zh-CN');
        const homeUrl = window.location.origin + '/index.html';
        container.innerHTML = `
            <div class="module-title">${moduleTitle}</div>
            <div class="result-text"><strong>✨ 你的幸运能量色：${resultColor} ✨</strong><br><br>${resultDetail}</div>
            <div class="date">📅 占卜日期：${today}</div>
            <div class="footer-invite">🎉 快邀请你的好友一起来测试吧！ 🎉</div>
            <div class="qrcode-area" id="qrcodeContainer"></div>
        `;
        // 生成二维码
        new QRCode(document.getElementById("qrcodeContainer"), {
            text: homeUrl,
            width: 100,
            height: 100,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        await new Promise(r => setTimeout(r, 300));
        const canvas = await html2canvas(container, { scale: 2, backgroundColor: null });
        const imgData = canvas.toDataURL("image/png");
        // 显示模态框
        const modal = document.getElementById("modalOverlay");
        const modalImg = document.getElementById("modalImage");
        modalImg.src = imgData;
        modal.classList.add("active");
        // 点击模态框外部关闭
        modal.onclick = (e) => {
            if (e.target === modal) {
                modal.classList.remove("active");
            }
        };
        // 可选：长按图片提示保存（移动端原生支持长按保存）
    }

    // 提交结果
    document.getElementById("submitBtn").onclick = () => {
        let color = getResult();
        if (color === null) {
            alert("请先完成所有题目");
            return;
        }
        let text = resultTexts[color];
        currentResultColor = color;
        currentResultText = text;
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 你的幸运能量色：${color} ✨</strong><br><br>${text}`;
        resultDiv.style.display = "block";
        document.getElementById("shareSection").style.display = "block";
        document.getElementById("rewardSection").style.display = "block";
    };

    // 分享按钮
    document.getElementById("shareBtn").onclick = async () => {
        if (!currentResultColor) {
            alert("请先完成测试并查看结果");
            return;
        }
        await generateShareImage("今日幸运能量色", currentResultColor, currentResultText);
    };

    render();
</script>
</body>
</html>
