<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>日常占卜 · 饮食运势</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', sans-serif;
            color: #f0eefc;
            padding: 2rem 1rem;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110,70,200,0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-home {
            display: inline-block;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            color: #ffbbf0;
            font-size: 0.8rem;
        }
        .card {
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border-left: 5px solid #ff77c6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffd6f0;
        }
        .question-item {
            margin-bottom: 1.5rem;
            background: rgba(0,0,0,0.25);
            border-radius: 1rem;
            padding: 1rem;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .opt-label {
            background: rgba(255,255,240,0.07);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }
        .opt-label.selected {
            background: #bf5eff40;
            border-color: #e27eff;
            color: white;
        }
        input[type="radio"] { display: none; }
        button {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            width: 100%;
        }
        .result {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.45);
            border-radius: 1.5rem;
            padding: 1rem;
            border-left: 4px solid #ff7bc2;
            display: none;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #6b62a0; margin-top: 2rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>🍽️ 今天适合吃哪种食物来提升运势？</h1>
        <div id="questionsContainer"></div>
        <button id="submitBtn">✨ 推荐今日美食 ✨</button>
        <div id="resultArea" class="result"></div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 每日一占</div>
</div>

<script>
    const questions = [
        { text: "你现在身体最直接的感觉是什么？", opts: ["心慌、手抖、胃紧绷", "眼皮打架、哈欠连天", "浑身是劲、坐不住", "没什么感觉、麻木、无聊"], types: ["焦虑型", "困倦型", "兴奋型", "平淡型"] },
        { text: "你上一顿吃了什么？", opts: ["没吃，或只喝了咖啡", "碳水炸弹（米饭/面条/面包）", "甜食/奶茶", "正常饭菜"], types: ["焦虑型", "困倦型", "兴奋型", "平淡型"] },
        { text: "你现在最渴望的味道是？", opts: ["酸的或苦的", "没胃口，什么都不想吃", "辣的或甜的", "咸的或淡的"], types: ["焦虑型", "困倦型", "兴奋型", "平淡型"] },
        { text: "如果现在必须吃一口东西，你会选？", opts: ["香蕉", "苹果", "黑巧克力", "苏打饼干"], types: ["焦虑型", "困倦型", "兴奋型", "平淡型"] }
    ];

    let answers = new Array(questions.length).fill(null);

    function render() {
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-item">
                        <div class="question-text">${q.text}</div>
                        <div class="options-group" data-qidx="${idx}">`;
            q.opts.forEach((opt, oidx) => {
                let selectedClass = (answers[idx] === oidx) ? 'selected' : '';
                html += `<label class="opt-label ${selectedClass}" data-oidx="${oidx}">${opt}<input type="radio" name="q${idx}" value="${oidx}"></label>`;
            });
            html += `</div></div>`;
        });
        document.getElementById("questionsContainer").innerHTML = html;
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.opt-label').forEach(label => {
            label.addEventListener('click', function(e) {
                let group = this.closest('.options-group');
                let qidx = group.dataset.qidx;
                let oidx = this.dataset.oidx;
                answers[qidx] = parseInt(oidx);
                group.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                let radio = this.querySelector('input');
                if (radio) radio.checked = true;
            });
        });
    }

    function getResult() {
        let scores = { "焦虑型":0, "困倦型":0, "兴奋型":0, "平淡型":0 };
        for (let i = 0; i < questions.length; i++) {
            let idx = answers[i];
            if (idx === null) return null;
            let type = questions[i].types[idx];
            scores[type] += 1;
        }
        let priority = ["焦虑型", "困倦型", "兴奋型", "平淡型"];
        let maxScore = -1, bestType = "平淡型";
        for (let t of priority) {
            if (scores[t] > maxScore) {
                maxScore = scores[t];
                bestType = t;
            }
        }
        return bestType;
    }

    const resultTexts = {
        "焦虑型": "“你现在像一只被踩了尾巴的猫，浑身炸毛。适合吃：一根香蕉。没错，就是香蕉。它含有天然镇静成分，比你的深呼吸管用。别喝咖啡，别吃辣，你会更焦。建议：把香蕉切成片，摆成笑脸，边吃边骂‘烦死了’。”",
        "困倦型": "“你现在的脑子和水泥一样稠。适合吃：一个苹果。别啃那种软趴趴的蛇果，要脆的、酸的、咬下去‘咔嚓’一声的。苹果的天然果糖和咀嚼声能把你从昏迷边缘拉回来。别吃米饭或面包，你会直接睡过去。”",
        "兴奋型": "“你像一只嗑了猫薄荷的猫，亢奋但马上要塌。适合吃：一小块黑巧克力（85%以上）。别吃糖，别喝奶茶，否则你会像过山车一样冲上去然后砸下来。黑巧克力能稳住你的兴奋，让你爽得更久。建议：含在嘴里慢慢化，别嚼。”",
        "平淡型": "“你今天像一碗白粥，不咸不淡，活着但没意思。适合吃：一小把原味坚果或者一杯温水。别追求刺激，你今天经不起折腾。平淡的日子就吃平淡的东西，但加一点点变化（比如换个杯子喝水）。你会发现：无聊也是一种幸福。”"
    };

    document.getElementById("submitBtn").onclick = () => {
        let res = getResult();
        if (res === null) {
            alert("请先完成所有题目");
            return;
        }
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 今日推荐饮食类型：${res} ✨</strong><br><br>${resultTexts[res]}`;
        resultDiv.style.display = "block";
    };

    render();
</script>
</body>
</html>
