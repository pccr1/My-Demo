<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>日常占卜 · 出门小细节</title>
    <link rel="stylesheet" href="/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>🚶 今天出门要注意的一个小细节是什么？</h1>
        <div id="questionsContainer"></div>
        <button id="submitBtn">✨ 查看细节提醒 ✨</button>
        <div id="resultArea" class="result"></div>
        <div id="shareSection" class="share-section">
            <button id="shareBtn" class="share-btn"><i class="fas fa-camera"></i> 生成分享图片</button>
            <div class="share-tip">✨ 点击生成精美图片，长按保存分享 ✨</div>
        </div>
        <div id="rewardSection" class="reward-section">
            <div class="reward-title">🌸 如果觉得不错，可以赏我一点辛苦费~ 🌸</div>
            <div class="reward-codes">
                <div class="reward-item"><img src="/picture/weixin.jpg" alt="微信赞赏码" onerror="this.src='https://placehold.co/80x80/2a1e45/ffb3e6?text=微信'"><br>微信赞赏</div>
                <div class="reward-item"><img src="/picture/zhifubao.jpg" alt="支付宝赞赏码" onerror="this.src='https://placehold.co/80x80/2a1e45/ffb3e6?text=支付宝'"><br>支付宝赞赏</div>
            </div>
        </div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 每日一占</div>
</div>

<div id="shareImageContainer" class="share-image-container"></div>
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <img id="modalImage" src="" alt="分享图片">
        <div class="close-tip">✨ 长按图片保存，点击空白处关闭 ✨</div>
    </div>
</div>

<script>
    const questions = [
        { text: "你今天出门前说的最后一句话是什么？", opts: ["对家人/室友说的（哪怕是“嗯”）","自言自语骂了一句","没说话"], scores: [[2,0,0],[1,0,0],[0,1,1]] },
        { text: "你最近一周丢过东西吗（钥匙/耳机/卡等）？", opts: ["丢过，而且不止一次","丢过一次","没丢过"], scores: [[0,3,0],[0,2,0],[0,0,0]] },
        { text: "你今天要去的第一个地点，是你熟悉的路还是新路？", opts: ["新路/不常走的路","老路但今天可能有变化（施工/限行）","闭着眼都能走的路"], scores: [[0,0,2],[0,0,1],[0,0,0]] },
        { text: "你今天的情绪状态会影响你说话的语气吗？", opts: ["会，我烦的时候说话很冲","会，我比较敏感容易多想","不会，我情绪稳定得像块砖"], scores: [[2,0,0],[1,0,0],[0,0,0]] },
        { text: "你出门前有没有习惯性摸口袋/查包包？", opts: ["从来不查，随缘","偶尔查","每次都查，强迫症"], scores: [[0,2,0],[0,1,0],[0,0,0]] }
    ];
    let answers = new Array(questions.length).fill(null);
    let currentResultKey = "";
    let currentResultText = "";

    function render() {
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-item">
                        <div class="question-text">${q.text}</div>
                        <div class="options-group" data-qidx="${idx}">`;
            q.opts.forEach((opt, oidx) => {
                let selectedClass = (answers[idx] === oidx) ? 'selected' : '';
                html += `<label class="opt-label ${selectedClass}" data-oidx="${oidx}">${opt}<input type="radio" name="q${idx}" value="${oidx}"></label>`;
            });
            html += `</div></div>`;
        });
        document.getElementById("questionsContainer").innerHTML = html;
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.opt-label').forEach(label => {
            label.addEventListener('click', function(e) {
                let group = this.closest('.options-group');
                let qidx = group.dataset.qidx;
                let oidx = this.dataset.oidx;
                answers[qidx] = parseInt(oidx);
                group.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                let radio = this.querySelector('input');
                if (radio) radio.checked = true;
            });
        });
    }

    function getResult() {
        let speech = 0, item = 0, route = 0;
        for (let i = 0; i < questions.length; i++) {
            let idx = answers[i];
            if (idx === null) return null;
            let [s, it, r] = questions[i].scores[idx];
            speech += s; item += it; route += r;
        }
        let max = Math.max(speech, item, route);
        if (speech === max) return "言行";
        if (item === max) return "物品";
        return "路线";
    }

    const resultTexts = {
        "言行": "“今天你的嘴可能比脑子快。注意：别抢话、别阴阳怪气、别在气头上回消息。你的一句话可能让人记三天。建议：发任何文字前，默数三秒再点发送。如果和真人聊天，先咽一下口水再开口。今天适合多说‘嗯’、‘对’、‘有道理’，少说‘但是’、‘不过’、‘你错了’。如果实在憋不住想说难听的，就去厕所对着镜子说。”",
        "物品": "“你今天出门可能会像没头苍蝇一样找东西。出门前做三件事：摸口袋（钥匙）、看桌子（手机）、拉包链（卡包）。建议：把需要带的东西放在鞋旁边，穿鞋的时候就能看见。如果已经出门了发现自己忘带，别回去拿，你今天缺了那个东西反而会更顺（玄学）。但充电宝不能忘，否则下午你会变成原始人。”",
        "路线": "“今天别走捷径。尽量走你平时走的路，别为了省五分钟去穿小路、小巷子、或者地图上看着近的陌生路线。你可能会遇到修路、封路、或者一只挡路的猫。另外，坐地铁别在最后一秒冲门，你会被夹。建议：今天比平时早出门5分钟，慢慢走，你会发现平时没注意到的风景（比如一家新开的早餐店）。"
    };

    function startIntenseConfetti() {
        const colors = ['#ff77c6', '#ffb347', '#6eff70', '#47a3ff', '#c56eff', '#ff4d4d'];
        for (let i = 0; i < 180; i++) {
            let conf = document.createElement("div");
            conf.className = "confetti";
            const size = Math.random() * 12 + 6;
            conf.style.width = size + "px";
            conf.style.height = size + "px";
            conf.style.left = Math.random() * window.innerWidth + "px";
            conf.style.top = "-30px";
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 1200);
        }
    }

    async function generateShareImage(moduleTitle, resultKey, resultDetail) {
        startIntenseConfetti();
        const container = document.getElementById("shareImageContainer");
        const today = new Date().toLocaleDateString('zh-CN');
        const homeUrl = window.location.origin + '/index.html';
        container.innerHTML = `
            <div class="module-title">${moduleTitle}</div>
            <div class="result-text"><strong>✨ 今日需注意的细节：${resultKey} ✨</strong><br><br>${resultDetail}</div>
            <div class="date">📅 占卜日期：${today}</div>
            <div class="footer-invite">🎉 快邀请你的好友一起来测试吧！ 🎉</div>
            <div class="qrcode-wrapper" id="qrcodeWrapper"></div>
        `;
        const qrWrapper = document.getElementById("qrcodeWrapper");
        const qrDiv = document.createElement("div");
        qrWrapper.appendChild(qrDiv);
        new QRCode(qrDiv, {
            text: homeUrl,
            width: 100,
            height: 100,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        await new Promise(r => setTimeout(r, 300));
        const canvas = await html2canvas(container, {
            scale: 2.5,
            backgroundColor: null,
            logging: false,
            useCORS: true,
            allowTaint: false
        });
        const imgData = canvas.toDataURL("image/png");
        const modal = document.getElementById("modalOverlay");
        const modalImg = document.getElementById("modalImage");
        modalImg.src = imgData;
        modal.classList.add("active");
        modal.onclick = (e) => {
            if (e.target === modal) modal.classList.remove("active");
        };
    }

    document.getElementById("submitBtn").onclick = () => {
        let key = getResult();
        if (key === null) {
            alert("请先完成所有题目");
            return;
        }
        let text = resultTexts[key];
        currentResultKey = key;
        currentResultText = text;
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 今日需注意的细节：${key} ✨</strong><br><br>${text}`;
        resultDiv.style.display = "block";
        document.getElementById("shareSection").style.display = "block";
        document.getElementById("rewardSection").style.display = "block";
    };

    document.getElementById("shareBtn").onclick = async () => {
        if (!currentResultKey) {
            alert("请先完成测试并查看结果");
            return;
        }
        await generateShareImage("出门小细节", currentResultKey, currentResultText);
    };

    render();
</script>
</body>
</html>
