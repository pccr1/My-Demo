<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>日常占卜 · 出门小细节</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', sans-serif;
            color: #f0eefc;
            padding: 2rem 1rem;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110,70,200,0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-home {
            display: inline-block;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            color: #ffbbf0;
            font-size: 0.8rem;
        }
        .card {
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border-left: 5px solid #ff77c6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffd6f0;
        }
        .question-item {
            margin-bottom: 1.5rem;
            background: rgba(0,0,0,0.25);
            border-radius: 1rem;
            padding: 1rem;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
        .options-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .opt-label {
            background: rgba(255,255,240,0.07);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }
        .opt-label.selected {
            background: #bf5eff40;
            border-color: #e27eff;
            color: white;
        }
        input[type="radio"] { display: none; }
        button {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            width: 100%;
        }
        .result {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.45);
            border-radius: 1.5rem;
            padding: 1rem;
            border-left: 4px solid #ff7bc2;
            display: none;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #6b62a0; margin-top: 2rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>🚪 今天出门要注意的一个小细节是什么？</h1>
        <div id="questionsContainer"></div>
        <button id="submitBtn">✨ 查看出门提醒 ✨</button>
        <div id="resultArea" class="result"></div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 每日一占</div>
</div>

<script>
    const questions = [
        { text: "你今天出门前说的最后一句话是什么？", opts: ["对家人/室友说的（哪怕是“嗯”）", "自言自语骂了一句", "没说话"], scores: [[2,0,0], [1,0,0], [0,1,1]] },
        { text: "你最近一周丢过东西吗（钥匙/耳机/卡等）？", opts: ["丢过，而且不止一次", "丢过一次", "没丢过"], scores: [[0,3,0], [0,2,0], [0,0,0]] },
        { text: "你今天要去的第一个地点，是你熟悉的路还是新路？", opts: ["新路/不常走的路", "老路但今天可能有变化（施工/限行）", "闭着眼都能走的路"], scores: [[0,0,2], [0,0,1], [0,0,0]] },
        { text: "你今天的情绪状态会影响你说话的语气吗？", opts: ["会，我烦的时候说话很冲", "会，我比较敏感容易多想", "不会，我情绪稳定得像块砖"], scores: [[2,0,0], [1,0,0], [0,0,0]] },
        { text: "你出门前有没有习惯性摸口袋/查包包？", opts: ["从来不查，随缘", "偶尔查", "每次都查，强迫症"], scores: [[0,2,0], [0,1,0], [0,0,0]] }
    ];

    let answers = new Array(questions.length).fill(null);

    function render() {
        let html = '';
        questions.forEach((q, idx) => {
            html += `<div class="question-item">
                        <div class="question-text">${q.text}</div>
                        <div class="options-group" data-qidx="${idx}">`;
            q.opts.forEach((opt, oidx) => {
                let selectedClass = (answers[idx] === oidx) ? 'selected' : '';
                html += `<label class="opt-label ${selectedClass}" data-oidx="${oidx}">${opt}<input type="radio" name="q${idx}" value="${oidx}"></label>`;
            });
            html += `</div></div>`;
        });
        document.getElementById("questionsContainer").innerHTML = html;
        attachEvents();
    }

    function attachEvents() {
        document.querySelectorAll('.opt-label').forEach(label => {
            label.addEventListener('click', function(e) {
                let group = this.closest('.options-group');
                let qidx = group.dataset.qidx;
                let oidx = this.dataset.oidx;
                answers[qidx] = parseInt(oidx);
                group.querySelectorAll('.opt-label').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                let radio = this.querySelector('input');
                if (radio) radio.checked = true;
            });
        });
    }

    function getResult() {
        let speech = 0, item = 0, route = 0;
        for (let i = 0; i < questions.length; i++) {
            let idx = answers[i];
            if (idx === null) return null;
            let [s, it, r] = questions[i].scores[idx];
            speech += s;
            item += it;
            route += r;
        }
        let maxVal = Math.max(speech, item, route);
        if (speech === maxVal) return "言行";
        if (item === maxVal) return "物品";
        return "路线";
    }

    const resultTexts = {
        "言行": "“今天你的嘴可能比脑子快。注意：别抢话、别阴阳怪气、别在气头上回消息。你的一句话可能让人记三天。建议：发任何文字前，默数三秒再点发送。如果和真人聊天，先咽一下口水再开口。今天适合多说‘嗯’、‘对’、‘有道理’，少说‘但是’、‘不过’、‘你错了’。如果实在憋不住想说难听的，就去厕所对着镜子说。”",
        "物品": "“你今天出门可能会像没头苍蝇一样找东西。出门前做三件事：摸口袋（钥匙）、看桌子（手机）、拉包链（卡包）。建议：把需要带的东西放在鞋旁边，穿鞋的时候就能看见。如果已经出门了发现自己忘带，别回去拿，你今天缺了那个东西反而会更顺（玄学）。但充电宝不能忘，否则下午你会变成原始人。”",
        "路线": "“今天别走捷径。尽量走你平时走的路，别为了省五分钟去穿小路、小巷子、或者地图上看着近的陌生路线。你可能会遇到修路、封路、或者一只挡路的猫。另外，坐地铁别在最后一秒冲门，你会被夹。建议：今天比平时早出门5分钟，慢慢走，你会发现平时没注意到的风景（比如一家新开的早餐店）。”"
    };

    document.getElementById("submitBtn").onclick = () => {
        let res = getResult();
        if (res === null) {
            alert("请先完成所有题目");
            return;
        }
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 今日出门需注意：${res} ✨</strong><br><br>${resultTexts[res]}`;
        resultDiv.style.display = "block";
    };

    render();
</script>
</body>
</html>
