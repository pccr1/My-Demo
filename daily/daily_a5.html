<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>日常占卜 · 星座贵人</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', sans-serif;
            color: #f0eefc;
            padding: 2rem 1rem;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110,70,200,0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-home {
            display: inline-block;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            color: #ffbbf0;
            font-size: 0.8rem;
        }
        .card {
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border-left: 5px solid #ff77c6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffd6f0;
        }
        .select-group {
            margin-bottom: 1.5rem;
        }
        .zodiac-select {
            background: #1e183a;
            border: 1px solid #b77eff;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            color: white;
            font-size: 1rem;
            width: 100%;
            font-family: inherit;
            cursor: pointer;
        }
        button {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            width: 100%;
        }
        .result {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.45);
            border-radius: 1.5rem;
            padding: 1rem;
            border-left: 4px solid #ff7bc2;
            display: none;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #6b62a0; margin-top: 2rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>⭐ 今天哪个星座的人会给你带来小幸运？</h1>
        <div class="select-group">
            <select id="zodiacSelect" class="zodiac-select">
                <option value="白羊座">白羊座 (3.21-4.19)</option>
                <option value="金牛座">金牛座 (4.20-5.20)</option>
                <option value="双子座">双子座 (5.21-6.21)</option>
                <option value="巨蟹座">巨蟹座 (6.22-7.22)</option>
                <option value="狮子座">狮子座 (7.23-8.22)</option>
                <option value="处女座">处女座 (8.23-9.22)</option>
                <option value="天秤座">天秤座 (9.23-10.23)</option>
                <option value="天蝎座">天蝎座 (10.24-11.22)</option>
                <option value="射手座">射手座 (11.23-12.21)</option>
                <option value="摩羯座">摩羯座 (12.22-1.19)</option>
                <option value="水瓶座">水瓶座 (1.20-2.18)</option>
                <option value="双鱼座">双鱼座 (2.19-3.20)</option>
            </select>
        </div>
        <button id="submitBtn">✨ 查看今日贵人 ✨</button>
        <div id="resultArea" class="result"></div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 每日一占</div>
</div>

<script>
    // 星座贵人映射表
    const zodiacMap = {
        "白羊座": { same: "狮子座", complement: "天秤座" },
        "金牛座": { same: "处女座", complement: "巨蟹座" },
        "双子座": { same: "天秤座", complement: "射手座" },
        "巨蟹座": { same: "天蝎座", complement: "摩羯座" },
        "狮子座": { same: "射手座", complement: "水瓶座" },
        "处女座": { same: "摩羯座", complement: "双鱼座" },
        "天秤座": { same: "水瓶座", complement: "白羊座" },
        "天蝎座": { same: "双鱼座", complement: "金牛座" },
        "射手座": { same: "白羊座", complement: "双子座" },
        "摩羯座": { same: "金牛座", complement: "巨蟹座" },
        "水瓶座": { same: "双子座", complement: "狮子座" },
        "双鱼座": { same: "巨蟹座", complement: "处女座" }
    };

    function getZodiacAdvice(zodiac) {
        let info = zodiacMap[zodiac];
        if (!info) return "请选择你的星座";
        return `<strong>同元素贵人（${info.same}）</strong><br>“和你${getElementDesc(zodiac)}的${info.same}，今天会点燃/稳住你的能量。如果你看到有人在群里发‘我来’、‘冲’，快贴上去。建议：主动找${info.same}说一句话，哪怕是‘吃饭没’，运气+30%。”<br><br>
                <strong>互补元素贵人（${info.complement}）</strong><br>“和你截然相反的${info.complement}，能帮你刹车/助推。今天如果有个${info.complement}的人给你建议，别烦，听进去。犹豫不决时找他们聊聊。”`;
    }

    function getElementDesc(zodiac) {
        const fire = ["白羊座","狮子座","射手座"];
        const earth = ["金牛座","处女座","摩羯座"];
        const air = ["双子座","天秤座","水瓶座"];
        const water = ["巨蟹座","天蝎座","双鱼座"];
        if (fire.includes(zodiac)) return "一样火";
        if (earth.includes(zodiac)) return "一样土";
        if (air.includes(zodiac)) return "一样飘忽";
        if (water.includes(zodiac)) return "一样水";
        return "";
    }

    document.getElementById("submitBtn").onclick = () => {
        let zodiac = document.getElementById("zodiacSelect").value;
        let advice = getZodiacAdvice(zodiac);
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 你的今日星座贵人 ✨</strong><br><br>${advice}`;
        resultDiv.style.display = "block";
    };
</script>
</body>
</html>
