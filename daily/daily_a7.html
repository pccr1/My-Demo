<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>日常占卜 · 心情行动数字</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0718;
            font-family: 'Inter', sans-serif;
            color: #f0eefc;
            padding: 2rem 1rem;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110,70,200,0.15), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }
        .back-home {
            display: inline-block;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            text-decoration: none;
            color: #ffbbf0;
            font-size: 0.8rem;
        }
        .card {
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 1.5rem;
            border-left: 5px solid #ff77c6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffd6f0;
        }
        .question-item {
            margin-bottom: 1.5rem;
            background: rgba(0,0,0,0.25);
            border-radius: 1rem;
            padding: 1rem;
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
        .number-input {
            background: #2a2348;
            border: 1px solid #c08eff;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            color: white;
            font-size: 1rem;
            width: 150px;
            text-align: center;
        }
        button {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            width: 100%;
        }
        .result {
            margin-top: 1.5rem;
            background: rgba(0,0,0,0.45);
            border-radius: 1.5rem;
            padding: 1rem;
            border-left: 4px solid #ff7bc2;
            display: none;
        }
        /* 分享按钮和赞赏码区域 */
        .action-area {
            margin-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }
        .share-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid #ff86c6;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .share-btn:hover {
            background: #ff44aa30;
            border-color: #ff69b4;
        }
        .reward-codes {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .reward-item {
            text-align: center;
            font-size: 0.7rem;
            color: #cbb1ff;
        }
        .reward-item img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: white;
            padding: 5px;
            margin-bottom: 4px;
        }
        .footer { text-align: center; font-size: 0.7rem; color: #6b62a0; margin-top: 2rem; }
        @media (max-width: 680px) {
            .reward-item img { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1>😊 今天如果只做一件事就能让心情变好，那会是什么？</h1>
        <div class="question-item">
            <div class="question-text">请凭直觉输入一个数字（1-10）：</div>
            <input type="number" id="moodNumber" class="number-input" min="1" max="10" step="1" value="5">
        </div>
        <button id="submitBtn">✨ 查看心情行动 ✨</button>
        <div id="resultArea" class="result"></div>
        <div id="actionArea" class="action-area" style="display: none;"></div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 每日一占</div>
</div>

<script>
    const moodTexts = {
        1: "“整理手机相册。删掉那些拍糊了的、重复的、还有前任的截图。你知道你手机里有几千张照片，80%永远不会再看。删完你会觉得人生清爽了20%。建议：边删边骂‘这拍的什么玩意儿’，效果加倍。”",
        2: "“给一个老朋友发‘突然想到你’。别发‘在吗’，别发小作文。就五个字。对方可能会回你一个表情包，然后你们聊三句就冷场——没关系，你心情已经好了。因为你知道自己还有人惦记。”",
        3: "“做一顿最简单的饭，哪怕只是泡面加蛋。别点外卖。看着水烧开、面煮软、蛋慢慢凝固——这个过程比你刷一小时手机管用。吃完把碗洗了，你会觉得自己像个能照顾好自己的成年人。”",
        4: "“出门散步15分钟，不许看手机。往左走，别规划路线。看一棵树、看一只狗、看一个走路比你慢的人。回来你会觉得刚才烦的那件事变小了。如果下雨，就站在窗边看雨，也算。”",
        5: "“把购物车里放了很久的东西删掉三分之一。那些‘以后可能用’、‘打折但不需要’的东西，删。你会获得一种‘我不需要那么多也能活’的快感。如果实在舍不得，截图存个档再删。”",
        6: "“洗个澡，从头到脚。水温比平时高一点。唱一首跑调的歌。吹头发的时候对着镜子翻个白眼。出来你会觉得换了一个人。科学研究（不是）证明：洗澡时的脑电波和冥想差不多。”",
        7: "“写三件今天已经发生的小好事。比如‘没迟到’、‘咖啡没洒’、‘没被老板骂’。再烂的一天也能凑出三件。写下来，读一遍。你会发现自己其实没惨到需要发朋友圈求安慰。”",
        8: "“扔掉一件你早就想扔但一直没扔的东西。过期的药、坏了的耳机、不再穿的衣服、前任送的礼物。扔的时候说一句‘拜拜了您嘞’。你会听到心里‘咔嗒’一声，那就是好心情的声音。”",
        9: "“看一段5分钟的沙雕视频。别刷剧，别看电影，就看那种猫摔跤、小孩说大人话、或者综艺翻车集锦。笑出声来，哪怕只是‘哼’一下。今天的快乐不需要深刻，蠢就够了。”",
        10: "“直接躺平，闭上眼睛，深呼吸10次。每次呼气的时候在心里说‘烦死了，出去’。10次之后如果还烦，就再来10次。如果还是烦，那就睡一觉。今天你已经很棒了（虽然可能并没有），但躺平不丢人。”"
    };

    function getResult() {
        let num = parseInt(document.getElementById("moodNumber").value);
        if (isNaN(num)) num = 5;
        num = Math.min(10, Math.max(1, num));
        return { num, text: moodTexts[num] };
    }

    function showShareAndReward(resultText) {
        let actionDiv = document.getElementById("actionArea");
        actionDiv.innerHTML = `
            <div class="share-btn" id="shareResultBtn"><i class="fab fa-share-alt"></i> 分享结果</div>
            <div class="reward-codes">
                <div class="reward-item"><img src="/picture/weixin.jpg" alt="微信赞赏码" onerror="this.src='https://placehold.co/80x80/2a1e45/ffb3e6?text=微信'"><br>微信赞赏</div>
                <div class="reward-item"><img src="/picture/zhifubao.jpg" alt="支付宝赞赏码" onerror="this.src='https://placehold.co/80x80/2a1e45/ffb3e6?text=支付宝'"><br>支付宝赞赏</div>
            </div>
        `;
        actionDiv.style.display = "flex";
        // 绑定分享事件
        const shareBtn = document.getElementById("shareResultBtn");
        if (shareBtn) {
            shareBtn.onclick = () => {
                let shareText = `【灵犀运势馆】今日心情行动：${resultText.substring(0, 80)}... 测测你的今日好运 → 遇事不决灵占馆`;
                if (navigator.share) {
                    navigator.share({
                        title: '灵犀运势馆 · 每日一占',
                        text: shareText,
                        url: window.location.href
                    }).catch(() => {});
                } else {
                    // 降级：复制链接
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        alert("链接已复制，可分享给朋友啦！");
                    }).catch(() => {
                        alert("手动分享吧：复制链接给好友~");
                    });
                }
            };
        }
    }

    document.getElementById("submitBtn").onclick = () => {
        let { num, text } = getResult();
        let resultDiv = document.getElementById("resultArea");
        resultDiv.innerHTML = `<strong>✨ 你的心情行动数字：${num} ✨</strong><br><br>${text}`;
        resultDiv.style.display = "block";
        showShareAndReward(text);
    };

    // 初始化
    getResult();
</script>
</body>
</html>
