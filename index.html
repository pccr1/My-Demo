<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>灵犀运势馆 · 先懂自己 再顺运势</title>
    <!-- 引入 Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0718;
            font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif;
            color: #f0eefc;
            line-height: 1.4;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110, 70, 200, 0.15), transparent 60%),
                        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            position: relative;
            z-index: 2;
        }

        /* 主视觉区域 */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 1rem 2.5rem;
            background: rgba(15, 12, 32, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(255, 100, 220, 0.3);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "✨";
            font-size: 180px;
            opacity: 0.05;
            position: absolute;
            bottom: -40px;
            right: -30px;
            pointer-events: none;
            transform: rotate(10deg);
        }

        .hero h1 {
            font-size: clamp(2.2rem, 8vw, 4.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #D9B4FF, #FF87C8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .hero .sub {
            font-size: 1.2rem;
            font-weight: 500;
            color: #cbbaff;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .hero .badge-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.2rem 0 0.6rem;
        }

        .hero .badge {
            background: rgba(255, 120, 210, 0.18);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 0.5px solid rgba(255, 130, 200, 0.5);
            color: #ffd6f0;
        }

        .hero .slogan {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 400;
            color: #aba4e6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 四大入口卡片区 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.8rem;
            margin: 3rem 0 2.8rem;
        }

        /* 卡片容器（同时也是下拉菜单的触发器） */
        .card-wrapper {
            position: relative;
        }

        .entry-card {
            background: rgba(18, 16, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.2s;
            box-shadow: 0 12px 25px -12px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .entry-card:hover {
            transform: translateY(-8px);
            border-color: #ff77c6;
            box-shadow: 0 25px 35px -15px #ff44aa40;
            background: rgba(28, 22, 58, 0.85);
        }

        .hero-pic {
            max-width: 100%;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            pointer-events: none;  /* 让图片不干扰点击事件 */
        }

        /* 下拉菜单样式 - 丝滑动画 */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            right: 0;
            background: rgba(12, 10, 28, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 0.8rem 0;
            border: 1px solid rgba(255, 135, 200, 0.4);
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.25s ease, visibility 0.25s, transform 0.25s ease;
            z-index: 100;
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
        }

        /* 显示菜单 */
        .card-wrapper.show-menu .dropdown-menu,
        .card-wrapper:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* 移动端：点击时保持显示（通过JS添加类） */
        .dropdown-menu li {
            padding: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dropdown-menu li:last-child {
            border-bottom: none;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.75rem 1.2rem;
            color: #f0eefc;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s, padding-left 0.2s;
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-menu a:hover {
            background: rgba(191, 94, 255, 0.3);
            padding-left: 1.5rem;
            color: #ffd6f0;
        }

        /* 滚动条美化 */
        .dropdown-menu::-webkit-scrollbar {
            width: 4px;
        }
        .dropdown-menu::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        .dropdown-menu::-webkit-scrollbar-thumb {
            background: #ff77c6;
            border-radius: 4px;
        }

        /* 移动端适配：菜单宽度跟随卡片 */
        @media (max-width: 680px) {
            .dropdown-menu {
                top: calc(100% + 8px);
                max-height: 280px;
            }
            .dropdown-menu a {
                padding: 0.7rem 1rem;
                font-size: 0.8rem;
                white-space: normal;
                word-break: break-word;
            }
        }

        /* 灵犀测彩蛋 */
        .extra-lingxi {
            margin-top: 2rem;
            text-align: center;
        }
        .lingxi-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid #bd8eff;
            border-radius: 80px;
            padding: 0.6rem 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
            transition: 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .lingxi-btn i {
            font-size: 1.2rem;
            color: #ffb86b;
        }
        .lingxi-tip {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: #cbb1ff;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6b62a0;
            border-top: 0.5px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }

        @media (max-width: 680px) {
            .container {
                padding: 1rem 1rem 2rem;
            }
            .cards-grid {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 主视觉区 banner -->
    <div class="hero">
        <h1>先懂自己，再顺运势</h1>
        <div class="sub">每一次选择都有答案</div>
        <div class="badge-group">
            <span class="badge"><i class="fas fa-moon"></i> 玄学风水专业度</span>
            <span class="badge"><i class="fas fa-brain"></i> 正统心理学底层逻辑</span>
            <span class="badge"><i class="fas fa-bolt"></i> 极致年轻化潮流玩法</span>
        </div>
        <div class="slogan">
            <i class="fas fa-crystal-ball"></i> 拒绝土味 · 拒绝废话 · 犀利戳心 · 灵魂共鸣 · 不贩卖焦虑 · 只给正向指引
        </div>
    </div>

    <!-- 四大入口卡片（带下拉菜单） -->
    <div class="cards-grid" id="cardsGrid"></div>

    <!-- 灵犀测彩蛋区 -->
    <div class="extra-lingxi">
        <div class="lingxi-btn" id="lingxiSurpriseBtn">
            <i class="fas fa-gem"></i> 灵犀测 · 一秒戳心
        </div>
        <div class="lingxi-tip" id="lingxiTip">
            ⚡ 戳一下，接收属于你的灵魂共鸣短句
        </div>
    </div>

    <footer>
        🌙 灵犀运势馆 · 东方智慧 + 心理洞察 | 所有指引皆为正向启发，愿你找到内核力量
    </footer>
</div>

<script>
    // ================= 配置区域（请根据实际文件夹和文件路径修改） =================
    // 每个模块包含：名称、图片路径、菜单项列表（每个项包含显示文字和链接）
    // 链接请填写相对于 index.html 的正确路径
    const modules = [
        {
            name: "日常灵占",
            imgSrc: "./picture/tu/1.png",
            // 菜单项：10个子页面，顺序与问题编号对应
            menuItems: [
                { text: "1. 今天你的幸运能量色是什么？", link: "/daily/daily_a1.html" },
                { text: "2. 今天你需要避开哪种情绪陷阱？", link: "/daily/daily_a2.html" },
                { text: "3. 此时你心里想的那件事，会有一个好的进展吗？", link: "/daily/daily_a3.html" },
                { text: "4. 心里想的这件事适合主动出击 or 等待观察", link: "/daily/daily_a4.html" },
                { text: "5. 今天你的星座贵人是谁？", link: "/daily/daily_a5.html" },
                { text: "6. 今天你在哪方面会超常发挥？", link: "/daily/daily_a6.html" },
                { text: "7. 今日心情行动数字", link: "/daily/daily_a7.html" },
                { text: "8. 今天你的能量签语是什么？", link: "/daily/daily_a8.html" },
                { text: "9. 今天吃哪种食物会提升运势？", link: "/daily/daily_a9.html" },
                { text: "10. 今天出门要注意的一个小细节是？", link: "/daily/daily_a10.html" }
            ]
        },
        {
            name: "心动密测",
            imgSrc: "./picture/tu/2.png",
            menuItems: [
                { text: "问题1：我最近遇见的人是正缘还是过客？", link: "/relationship/relationship_a1.html" },
                { text: "问题2：TA现在对我的真实态度是？", link: "/relationship/relationship_a2.html" },
                { text: "问题3：我们这段关系最需要打破的循环是？", link: "/relationship/relationship_a3.html" },
                { text: "问题4：我放不下的那段感情，还有复合必要吗？", link: "/relationship/relationship_a4.html" },
                { text: "问题5：我目前的恋爱阻障是来源于自己还是来自于环境？", link: "/relationship/relationship_a5.html" },
                { text: "问题6：下次心动会出现在什么场景？", link: "/relationship/relationship_a6.html" },
                { text: "问题7：在感情中你最会被哪种类型的人吸引但伤害？", link: "/relationship/relationship_a7.html" },
                { text: "问题8：如果现在你主动示好，成功率有多高？", link: "/relationship/relationship_a8.html" },
                { text: "问题9：这段暧昧关系，一个月内会明朗化发展吗？", link: "/relationship/relationship_a9.html" },
                { text: "问题10：你内心渴望的爱情模式是？", link: "/relationship/relationship_a10.html" }
            ]
        },
        {
            name: "事业命格",
            imgSrc: "./picture/tu/3.png",
            menuItems: [
                { text: "1. 你现在的工作，是长期饭票还是过渡跳板？", link: "/career/career_a1.html" },
                { text: "2. 你适合做专家型人才还是管理型人才？", link: "/career/career_a2.html" },
                { text: "3. 如果你今年想搞副业，哪个方向会容易成功？", link: "/career/career_a3.html" },
                { text: "4. 最近三个月，跳槽的时机分数是多少？", link: "/career/career_a4.html" },
                { text: "5. 你在职场中最容易吃亏的性格弱点是什么？", link: "/career/career_a5.html" },
                { text: "6. 你适合单干/自由职业，还是团队合作？", link: "/career/career_a6.html" },
                { text: "7. 什么岗位/行业是你的隐藏天赋领域？", link: "/career/career_a7.html" },
                { text: "8. 我的收入瓶颈，主要是能力问题还是选择问题？", link: "/career/career_a8.html" },
                { text: "9. 如果我不考虑钱，我会选择什么职业？", link: "/career/career_a9.html" },
                { text: "10. 未来一年的事业关键词是什么？", link: "/career/career_a10.html" }
            ]
        },
        {
            name: "人格星盘",
            imgSrc: "./picture/tu/4.png",
            menuItems: [
                { text: "1. 你当前的人生阶段，是积累期还是爆发期？", link: "/star/star_a1.html" },
                { text: "2. 你最大的贵人线索藏在哪里？", link: "/star/star_a2.html" },
                { text: "3. 你最容易在哪类事情上反复内耗？如何破局？", link: "/star/star_a3.html" },
                { text: "4. 如果你保持现状三年，最可能失去什么？", link: "/star/star_a4.html" },
                { text: "5. 你真正适合的城市/环境类型是？", link: "/star/star_a5.html" },
                { text: "6. 我的人生使命更偏向创造、服务、影响还是探索？", link: "/star/star_a6.html" },
                { text: "7. 我在今年最应该放下的执念是什么？", link: "/star/star_a7.html" },
                { text: "8. 什么样的社交圈，才能托举我走向下一个层级？", link: "/star/star_a8.html" },
                { text: "9. 我的人生建议书:30岁前该补哪些短板？", link: "/star/star_a9.html" },
                { text: "10. 如果我的人生是一本书，这一章的主题应该叫什么？", link: "/star/star_a10.html" }
            ]
        }
    ];

    // ================= 渲染卡片及下拉菜单 =================
    const container = document.getElementById("cardsGrid");
    function buildCards() {
        let html = '';
        modules.forEach((mod, idx) => {
            // 生成菜单项HTML
            let menuHtml = '<ul class="dropdown-menu">';
            mod.menuItems.forEach(item => {
                menuHtml += `<li><a href="${item.link}">${item.text}</a></li>`;
            });
            menuHtml += '</ul>';

            html += `
                <div class="card-wrapper" data-module="${idx}">
                    <div class="entry-card">
                        <img class="hero-pic" src="${mod.imgSrc}" onerror="this.onerror=null; this.src='https://placehold.co/400x200/2a1e45/ffb3e6?text=${encodeURIComponent(mod.name)}';">
                    </div>
                    ${menuHtml}
                </div>
            `;
        });
        container.innerHTML = html;
    }
    buildCards();

    // ================= 交互逻辑：PC悬停 + 移动端点击 =================
    // 判断是否为触摸设备（移动端）
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    // 存储当前打开的菜单（移动端用于关闭）
    let activeWrapper = null;

    // 全局点击关闭菜单（移动端）
    function closeAllMenus(exceptWrapper = null) {
        document.querySelectorAll('.card-wrapper').forEach(wrapper => {
            if (exceptWrapper !== wrapper) {
                wrapper.classList.remove('show-menu');
            }
        });
        if (exceptWrapper === null) activeWrapper = null;
    }

    // 移动端：点击卡片切换菜单
    if (isTouchDevice) {
        document.querySelectorAll('.card-wrapper').forEach(wrapper => {
            const card = wrapper.querySelector('.entry-card');
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                // 如果当前菜单已打开，则关闭；否则关闭所有并打开当前
                if (wrapper.classList.contains('show-menu')) {
                    wrapper.classList.remove('show-menu');
                    activeWrapper = null;
                } else {
                    closeAllMenus(wrapper);
                    wrapper.classList.add('show-menu');
                    activeWrapper = wrapper;
                }
            });
        });
        // 点击页面其他地方关闭所有菜单
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.card-wrapper')) {
                closeAllMenus();
            }
        });
        // 防止菜单内部链接点击时冒泡关闭
        document.querySelectorAll('.dropdown-menu a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        });
    } else {
        // PC端：完全依赖 CSS hover，不需要额外 JS，但为了防止hover时菜单抖动，保留原生样式即可
        // 我们不需要添加任何额外脚本，因为 .card-wrapper:hover .dropdown-menu 已经生效
        // 但为了优雅，可以为卡片添加一点延迟关闭的效果（CSS已处理）
        // 同时，为了防止移动端样式干扰，不做额外处理
    }

    // 可选：为图片加载失败时提供更好的占位（上面已内置）
    // 灵犀测彩蛋脚本
    const lingxiMessages = [
        "🌙 别让焦虑偷走当下的灵感，你本自具足。",
        "💫 你无须成为别人，你的独特就是最好的风水。",
        "✨ 每一次选择都在塑造你，记得选择温柔待己。",
        "🌊 运势像潮汐，低谷时沉淀，涨潮时绽放。",
        "🔥 你内心那团火，比任何星盘都亮。",
        "🌸 拒绝自我怀疑，今天请和自己和解。",
        "🎯 事业的答案不在远方，在你每一次微行动里。",
        "💞 心动不如行动，但也允许自己慢慢来。"
    ];
    
    function showRandomLingxi() {
        const randomIndex = Math.floor(Math.random() * lingxiMessages.length);
        const tipDiv = document.getElementById('lingxiTip');
        if (tipDiv) {
            tipDiv.innerHTML = `<i class="fas fa-feather-alt"></i> ${lingxiMessages[randomIndex]} <i class="fas fa-heart"></i>`;
            setTimeout(() => {
                if (tipDiv && !tipDiv.innerHTML.includes("一秒戳心")) {
                    tipDiv.innerHTML = `⚡ 戳一下，接收属于你的灵魂共鸣短句`;
                }
            }, 4000);
        }
    }
    
    const lingxiBtn = document.getElementById('lingxiSurpriseBtn');
    if (lingxiBtn) {
        lingxiBtn.addEventListener('click', showRandomLingxi);
    }

    // 移动端额外优化：重新绑定动态生成的菜单链接（确保无冲突）
    // 因为菜单是动态生成的，需要重新绑定阻止冒泡（移动端已有全局监听，但链接本身的点击不应关闭菜单，已处理）
    function rebindMobileLinks() {
        if (!isTouchDevice) return;
        document.querySelectorAll('.dropdown-menu a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        });
    }
    rebindMobileLinks();
    // 监听可能的重新渲染（无需，因为只渲染一次）
</script>
</body>
</html>
