<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>灵犀运势馆 · 先懂自己 再顺运势</title>
    <!-- 引入 Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0718;
            font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif;
            color: #f0eefc;
            line-height: 1.4;
            overflow-x: hidden;
        }

        /* 背景噪点 + 光晕 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110, 70, 200, 0.15), transparent 60%),
                        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            position: relative;
            z-index: 2;
        }

        /* 主视觉区域 */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 1rem 2.5rem;
            background: rgba(15, 12, 32, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(255, 100, 220, 0.3);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "✨";
            font-size: 180px;
            opacity: 0.05;
            position: absolute;
            bottom: -40px;
            right: -30px;
            pointer-events: none;
            transform: rotate(10deg);
        }

        .hero h1 {
            font-size: clamp(2.2rem, 8vw, 4.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #D9B4FF, #FF87C8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .hero .sub {
            font-size: 1.2rem;
            font-weight: 500;
            color: #cbbaff;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .hero .badge-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.2rem 0 0.6rem;
        }

        .hero .badge {
            background: rgba(255, 120, 210, 0.18);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 0.5px solid rgba(255, 130, 200, 0.5);
            color: #ffd6f0;
        }

        .hero .slogan {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 400;
            color: #aba4e6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 四大入口卡片区 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.8rem;
            margin: 3rem 0 2.8rem;
        }

        .entry-card {
            background: rgba(18, 16, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.2s;
            /* border: 1px solid rgba(210, 140, 255, 0.3); */
            box-shadow: 0 12px 25px -12px rgba(0,0,0,0.4);
            /* padding: 1rem; */
        }

        .entry-card:hover {
            transform: translateY(-8px);
            border-color: #ff77c6;
            box-shadow: 0 25px 35px -15px #ff44aa40;
            background: rgba(28, 22, 58, 0.85);
        }

        .hero-pic {
            max-width: 100%;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 16px;
        }

        /* 灵犀测彩蛋 */
        .extra-lingxi {
            margin-top: 2rem;
            text-align: center;
        }
        .lingxi-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid #bd8eff;
            border-radius: 80px;
            padding: 0.6rem 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
            transition: 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .lingxi-btn i {
            font-size: 1.2rem;
            color: #ffb86b;
        }
        .lingxi-tip {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: #cbb1ff;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6b62a0;
            border-top: 0.5px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }

        @media (max-width: 680px) {
            .container {
                padding: 1rem 1rem 2rem;
            }
            .cards-grid {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 主视觉区 banner -->
    <div class="hero">
        <h1>先懂自己，再顺运势</h1>
        <div class="sub">每一次选择都有答案</div>
        <div class="badge-group">
            <span class="badge"><i class="fas fa-moon"></i> 玄学风水专业度</span>
            <span class="badge"><i class="fas fa-brain"></i> 正统心理学底层逻辑</span>
            <span class="badge"><i class="fas fa-bolt"></i> 极致年轻化潮流玩法</span>
        </div>
        <div class="slogan">
            <i class="fas fa-crystal-ball"></i> 拒绝土味 · 拒绝废话 · 犀利戳心 · 灵魂共鸣 · 不贩卖焦虑 · 只给正向指引
        </div>
    </div>

    <!-- 四大跳转卡片（已改为独立子页面链接） -->
    <div class="cards-grid">
        <a href="daily.html" style="text-decoration: none; display: block;">
            <div class="entry-card">
                <img class="hero-pic" src="./picture/tu/1.png" onerror="this.onerror=null; this.src='https://placehold.co/400x200/2a1e45/ffb3e6?text=日常灵占';">
            </div>
        </a>
        <a href="relationship.html" style="text-decoration: none; display: block;">
            <div class="entry-card">
                <img class="hero-pic" src="./picture/tu/2.png" onerror="this.onerror=null; this.src='https://placehold.co/400x200/2a1e45/ffb3e6?text=心动密测';">
            </div>
        </a>
        <a href="career.html" style="text-decoration: none; display: block;">
            <div class="entry-card">
                <img class="hero-pic" src="./picture/tu/3.png" onerror="this.onerror=null; this.src='https://placehold.co/400x200/2a1e45/ffb3e6?text=事业命格';">
            </div>
        </a>
        <a href="star.html" style="text-decoration: none; display: block;">
            <div class="entry-card">
                <img class="hero-pic" src="./picture/tu/4.png" onerror="this.onerror=null; this.src='https://placehold.co/400x200/2a1e45/ffb3e6?text=人格星盘';">
            </div>
        </a>
    </div>

    <!-- 灵犀测彩蛋区 -->
    <div class="extra-lingxi">
        <div class="lingxi-btn" id="lingxiSurpriseBtn">
            <i class="fas fa-gem"></i> 灵犀测 · 一秒戳心
        </div>
        <div class="lingxi-tip" id="lingxiTip">
            ⚡ 戳一下，接收属于你的灵魂共鸣短句
        </div>
    </div>

    <footer>
        🌙 灵犀运势馆 · 东方智慧 + 心理洞察 | 所有指引皆为正向启发，愿你找到内核力量
    </footer>
</div>

<script>
    // 灵犀测彩蛋脚本（独立运行，不依赖任何测试模块）
    const lingxiMessages = [
        "🌙 别让焦虑偷走当下的灵感，你本自具足。",
        "💫 你无须成为别人，你的独特就是最好的风水。",
        "✨ 每一次选择都在塑造你，记得选择温柔待己。",
        "🌊 运势像潮汐，低谷时沉淀，涨潮时绽放。",
        "🔥 你内心那团火，比任何星盘都亮。",
        "🌸 拒绝自我怀疑，今天请和自己和解。",
        "🎯 事业的答案不在远方，在你每一次微行动里。",
        "💞 心动不如行动，但也允许自己慢慢来。"
    ];
    
    function showRandomLingxi() {
        const randomIndex = Math.floor(Math.random() * lingxiMessages.length);
        const tipDiv = document.getElementById('lingxiTip');
        if (tipDiv) {
            tipDiv.innerHTML = `<i class="fas fa-feather-alt"></i> ${lingxiMessages[randomIndex]} <i class="fas fa-heart"></i>`;
            setTimeout(() => {
                if (tipDiv && !tipDiv.innerHTML.includes("一秒戳心")) {
                    tipDiv.innerHTML = `⚡ 戳一下，接收属于你的灵魂共鸣短句`;
                }
            }, 4000);
        }
    }
    
    const lingxiBtn = document.getElementById('lingxiSurpriseBtn');
    if (lingxiBtn) {
        lingxiBtn.addEventListener('click', showRandomLingxi);
    }
</script>
</body>
</html>
