<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>灵犀运势馆 · 先懂自己 再顺运势</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0718;
            font-family: 'Inter', 'Space Grotesk', system-ui, -apple-system, sans-serif;
            color: #f0eefc;
            line-height: 1.4;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(110, 70, 200, 0.15), transparent 60%),
                        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
            position: relative;
            z-index: 2;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 1rem 2.5rem;
            background: rgba(15, 12, 32, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            border: 1px solid rgba(255, 100, 220, 0.3);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "✨";
            font-size: 180px;
            opacity: 0.05;
            position: absolute;
            bottom: -40px;
            right: -30px;
            pointer-events: none;
            transform: rotate(10deg);
        }

        .hero h1 {
            font-size: clamp(2.2rem, 8vw, 4.2rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #D9B4FF, #FF87C8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .hero .sub {
            font-size: 1.2rem;
            font-weight: 500;
            color: #cbbaff;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .hero .badge-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.2rem 0 0.6rem;
        }

        .hero .badge {
            background: rgba(255, 120, 210, 0.18);
            backdrop-filter: blur(4px);
            padding: 0.4rem 1.1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 500;
            border: 0.5px solid rgba(255, 130, 200, 0.5);
            color: #ffd6f0;
        }

        .hero .slogan {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 400;
            color: #aba4e6;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.8rem;
            margin: 3rem 0 2.8rem;
        }

        .card-wrapper {
            position: relative;
        }

        .entry-card {
            background: rgba(18, 16, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.2s;
            box-shadow: 0 12px 25px -12px rgba(0,0,0,0.4);
            cursor: pointer;
            position: relative;
        }

        /* 基础 hover 效果 */
        .entry-card:hover,
        .card-wrapper.menu-active .entry-card {
            transform: translateY(-8px);
            border-color: #ff77c6;
            box-shadow: 0 25px 35px -15px #ff44aa40;
            background: rgba(28, 22, 58, 0.85);
        }

        .hero-pic {
            max-width: 100%;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            pointer-events: none;
        }

        /* 箭头指示器样式 */
        .arrow-indicator {
            position: absolute;
            bottom: 12px;
            right: 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #ffb6e6;
            transition: all 0.2s ease;
            pointer-events: none;  /* 让箭头不干扰点击 */
            z-index: 3;
            border: 1px solid rgba(255, 135, 200, 0.5);
        }
        .entry-card:hover .arrow-indicator {
            background: rgba(255, 100, 200, 0.3);
            color: #fff;
            transform: scale(1.05);
        }
        /* 箭头图标平滑旋转（由JS切换类） */
        .arrow-indicator i {
            transition: transform 0.25s ease;
        }
        /* 菜单展开时箭头向上 */
        .card-wrapper.menu-active .arrow-indicator i {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            right: 0;
            background: rgba(12, 10, 28, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 0.8rem 0;
            border: 1px solid rgba(255, 135, 200, 0.4);
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            transform-origin: top center;
            animation: menuFadeIn 0.2s ease;
        }

        @keyframes menuFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-menu li {
            padding: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dropdown-menu li:last-child {
            border-bottom: none;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.75rem 1.2rem;
            color: #f0eefc;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s, padding-left 0.2s;
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-menu a:hover {
            background: rgba(191, 94, 255, 0.3);
            padding-left: 1.5rem;
            color: #ffd6f0;
        }

        .dropdown-menu::-webkit-scrollbar {
            width: 4px;
        }
        .dropdown-menu::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        .dropdown-menu::-webkit-scrollbar-thumb {
            background: #ff77c6;
            border-radius: 4px;
        }

        @media (max-width: 680px) {
            .dropdown-menu {
                top: calc(100% + 8px);
                max-height: 280px;
            }
            .dropdown-menu a {
                padding: 0.7rem 1rem;
                font-size: 0.8rem;
                white-space: normal;
                word-break: break-word;
            }
            .arrow-indicator {
                bottom: 8px;
                right: 10px;
                width: 24px;
                height: 24px;
                font-size: 12px;
            }
        }

        /* 微信私占模块样式 */
        .wechat-section {
            margin: 3rem auto 2rem;
            max-width: 420px;
            background: rgba(18, 16, 40, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 135, 200, 0.4);
            padding: 1.5rem 1.2rem;
            text-align: center;
            transition: 0.2s;
        }
        .wechat-section:hover {
            border-color: #ff77c6;
            background: rgba(28, 22, 58, 0.8);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .wechat-title {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFD6F0, #D9B4FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .wechat-sub {
            font-size: 0.8rem;
            color: #cbbaff;
            margin-bottom: 1rem;
        }
        .qrcode-img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 1rem;
            border: 2px solid rgba(255, 135, 200, 0.6);
            background: #fff;
            padding: 0.25rem;
            transition: 0.2s;
            cursor: pointer;
        }
        .qrcode-img:hover {
            transform: scale(1.02);
            border-color: #ff77c6;
            box-shadow: 0 0 12px rgba(255, 119, 198, 0.5);
        }
        .wechat-tip {
            margin-top: 0.8rem;
            font-size: 0.7rem;
            color: #8b7ab8;
        }

        .extra-lingxi {
            margin-top: 2rem;
            text-align: center;
        }
        .lingxi-btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid #bd8eff;
            border-radius: 80px;
            padding: 0.6rem 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(8px);
            transition: 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .lingxi-btn i {
            font-size: 1.2rem;
            color: #ffb86b;
        }
        .lingxi-tip {
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: #cbb1ff;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6b62a0;
            border-top: 0.5px solid rgba(255,255,255,0.1);
            padding-top: 2rem;
        }

        @media (max-width: 680px) {
            .container {
                padding: 1rem 1rem 2rem;
            }
            .cards-grid {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">

                <i class="fas fa-shield-alt"></i> 鲁ICP备2026029419号

</footer>

</div>

<script>
    // 模块配置
    const modules = [
        {
            name: "日常灵占",
            imgSrc: "./picture/tu/1.jpg",
            menuItems: [
                { text: "1. 今天你的幸运能量色是什么？", link: "/text.html?id=daily/daily_1" },
                { text: "2. 今天你需要避开哪种情绪陷阱？", link: "/text.html?id=daily/daily_2" },
                { text: "3. 此时你心里想的那件事，会有一个好的进展吗？", link: "/text.html?id=daily/daily_3" },
                { text: "4. 心里想的这件事适合主动出击 or 等待观察", link: "/text.html?id=daily/daily_4" },
                { text: "5. 今天你的星座贵人是谁？", link: "/text.html?id=daily/daily_5" },
                { text: "6. 今天你在哪方面会超常发挥？", link: "/text.html?id=daily/daily_6" },
                { text: "7. 今日心情行动数字", link: "/text.html?id=daily/daily_7" },
                { text: "8. 今天你的能量签语是什么？", link: "/text.html?id=daily/daily_8" },
                { text: "9. 今天吃哪种食物会提升运势？", link: "/text.html?id=daily/daily_9" },
                { text: "10. 今天出门要注意的一个小细节是？", link: "/text.html?id=daily/daily_10" }
            ]
        },
        {
            name: "心动密测",
            imgSrc: "./picture/tu/2.jpg",
            menuItems: [
                { text: "1. 我最近遇见的人是正缘还是过客？", link: "/text.html?id=heart/heart_1" },
                { text: "2. TA现在对我的真实态度是？", link: "/text.html?id=heart/heart_2" },
                { text: "3. 我们这段关系最需要打破的循环是？", link: "/text.html?id=heart/heart_3" },
                { text: "4. 我放不下的那段感情，还有复合必要吗？", link: "/text.html?id=heart/heart_4" },
                { text: "5. 我目前的恋爱阻障是来源于自己还是来自于环境？", link: "/text.html?id=heart/heart_5" },
                { text: "6. 下次心动会出现在什么场景？", link: "/text.html?id=heart/heart_6" },
                { text: "7. 在感情中你最会被哪种类型的人吸引但伤害？", link: "/text.html?id=heart/heart_7" },
                { text: "8. 如果现在你主动示好，成功率有多高？", link: "/text.html?id=heart/heart_8" },
                { text: "9. 这段暧昧关系，一个月内会明朗化发展吗？", link: "/text.html?id=heart/heart_9" },
                { text: "10. 你内心渴望的爱情模式是？", link: "/text.html?id=heart/heart_10" }
            ]
        },
        {
            name: "事业命格",
            imgSrc: "./picture/tu/3.jpg",
            menuItems: [
                { text: "1. 你现在的工作，是长期饭票还是过渡跳板？", link: "/text.html?id=career/career_1" },
                { text: "2. 你适合做专家型人才还是管理型人才？", link: "/text.html?id=career/career_2" },
                { text: "3. 如果你今年想搞副业，哪个方向会容易成功？", link: "/text.html?id=career/career_3" },
                { text: "4. 最近三个月，跳槽的时机分数是多少？", link: "/text.html?id=career/career_4" },
                { text: "5. 你在职场中最容易吃亏的性格弱点是什么？", link: "/text.html?id=career/career_5" },
                { text: "6. 你适合单干/自由职业，还是团队合作？", link: "/text.html?id=career/career_6" },
                { text: "7. 什么岗位/行业是你的隐藏天赋领域？", link: "/text.html?id=career/career_7" },
                { text: "8. 我的收入瓶颈，主要是能力问题还是选择问题？", link: "/text.html?id=career/career_8" },
                { text: "9. 如果我不考虑钱，我会选择什么职业？", link: "/text.html?id=career/career_9" },
                { text: "10. 未来一年的事业关键词是什么？", link: "/text.html?id=career/career_10" }
            ]
        },
        {
            name: "人格星盘",
            imgSrc: "./picture/tu/4.jpg",
            menuItems: [
                { text: "1. 你当前的人生阶段，是积累期还是爆发期？", link: "/text.html?id=life/life_1" },
                { text: "2. 你最大的贵人线索藏在哪里？", link: "/text.html?id=life/life_2" },
                { text: "3. 你最容易在哪类事情上反复内耗？如何破局？", link: "/text.html?id=life/life_3" },
                { text: "4. 如果你保持现状三年，最可能失去什么？", link: "/text.html?id=life/life_4" },
                { text: "5. 你真正适合的城市/环境类型是？", link: "/text.html?id=life/life_5" },
                { text: "6. 我的人生使命更偏向创造、服务、影响还是探索？", link: "/text.html?id=life/life_6" },
                { text: "7. 我在今年最应该放下的执念是什么？", link: "/text.html?id=life/life_7" },
                { text: "8. 什么样的社交圈，才能托举我走向下一个层级？", link: "/text.html?id=life/life_8" },
                { text: "9. 我的人生建议书:30岁前该补哪些短板？", link: "/text.html?id=life/life_9" },
                { text: "10. 如果我的人生是一本书，这一章的主题应该叫什么？", link: "/text.html?id=life/life_10" }
            ]
        }
    ];

    // 渲染卡片（增加箭头图标）
    const container = document.getElementById("cardsGrid");
    function buildCards() {
        let html = '';
        modules.forEach((mod, idx) => {
            let menuHtml = '<ul class="dropdown-menu">';
            mod.menuItems.forEach(item => {
                menuHtml += `<li><a href="${item.link}">${item.text}</a></li>`;
            });
            menuHtml += '</ul>';
            html += `
                <div class="card-wrapper" data-module="${idx}">
                    <div class="entry-card">
                        <img class="hero-pic" src="${mod.imgSrc}" onerror="this.onerror=null; this.src='https://placehold.co/400x200/2a1e45/ffb3e6?text=${encodeURIComponent(mod.name)}';">
                        <div class="arrow-indicator" title="点击展开/收回菜单">
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                    ${menuHtml}
                </div>
            `;
        });
        container.innerHTML = html;
    }
    buildCards();

    // ========== 交互核心（含箭头方向自动切换） ==========
    (function() {
        const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const wrappers = document.querySelectorAll('.card-wrapper');
        if (!wrappers.length) return;

        function getMenu(wrapper) {
            return wrapper.querySelector('.dropdown-menu');
        }

        // 隐藏菜单并移除激活类（同时箭头图标由CSS旋转自动完成，无需额外处理）
        function hideMenu(wrapper) {
            const menu = getMenu(wrapper);
            if (menu) menu.style.display = 'none';
            wrapper.removeAttribute('data-click-open');
            wrapper.classList.remove('menu-active');
        }

        // 显示菜单并添加激活类（箭头自动旋转）
        function showMenu(wrapper) {
            wrappers.forEach(other => {
                if (other !== wrapper) hideMenu(other);
            });
            const menu = getMenu(wrapper);
            if (menu) menu.style.display = 'block';
            wrapper.setAttribute('data-click-open', 'true');
            wrapper.classList.add('menu-active');
        }

        function isMenuVisible(wrapper) {
            const menu = getMenu(wrapper);
            return menu && menu.style.display === 'block';
        }

        // 1. 点击卡片切换菜单
        wrappers.forEach(wrapper => {
            const card = wrapper.querySelector('.entry-card');
            if (!card) return;

            card.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isMenuVisible(wrapper)) {
                    hideMenu(wrapper);
                } else {
                    showMenu(wrapper);
                }
            });
        });

        // 2. 非移动端悬停显示/隐藏（不干扰点击状态）
        if (!isMobile) {
            wrappers.forEach(wrapper => {
                let leaveTimer = null;

                wrapper.addEventListener('mouseenter', () => {
                    clearTimeout(leaveTimer);
                    if (!wrapper.hasAttribute('data-click-open')) {
                        wrappers.forEach(other => {
                            if (other !== wrapper) hideMenu(other);
                        });
                        const menu = getMenu(wrapper);
                        if (menu) menu.style.display = 'block';
                        // 悬停打开时不移除或添加 menu-active，保持箭头不变
                    }
                });

                wrapper.addEventListener('mouseleave', () => {
                    leaveTimer = setTimeout(() => {
                        if (!wrapper.hasAttribute('data-click-open')) {
                            hideMenu(wrapper);
                        }
                    }, 150);
                });
            });
        }

        // 3. 点击空白关闭所有菜单
        document.addEventListener('click', (e) => {
            let inside = false;
            wrappers.forEach(wrapper => {
                if (wrapper.contains(e.target)) inside = true;
            });
            if (!inside) {
                wrappers.forEach(wrapper => {
                    if (wrapper.hasAttribute('data-click-open')) {
                        hideMenu(wrapper);
                    } else {
                        const menu = getMenu(wrapper);
                        if (menu && menu.style.display === 'block') {
                            menu.style.display = 'none';
                            wrapper.classList.remove('menu-active');
                        }
                    }
                });
            }
        });
    })();

    // 灵犀彩蛋
    const lingxiMessages = [
        "🌙 别让焦虑偷走当下的灵感，你本自具足。",
        "💫 你无须成为别人，你的独特就是最好的风水。",
        "✨ 每一次选择都在塑造你，记得选择温柔待己。",
        "🌊 运势像潮汐，低谷时沉淀，涨潮时绽放。",
        "🔥 你内心那团火，比任何星盘都亮。",
        "🌸 拒绝自我怀疑，今天请和自己和解。",
        "🎯 事业的答案不在远方，在你每一次微行动里。",
        "💞 心动不如行动，但也允许自己慢慢来。"
    ];
    
    function showRandomLingxi() {
        const randomIndex = Math.floor(Math.random() * lingxiMessages.length);
        const tipDiv = document.getElementById('lingxiTip');
        if (tipDiv) {
            tipDiv.innerHTML = `<i class="fas fa-feather-alt"></i> ${lingxiMessages[randomIndex]} <i class="fas fa-heart"></i>`;
            setTimeout(() => {
                if (tipDiv && !tipDiv.innerHTML.includes("一秒戳心")) {
                    tipDiv.innerHTML = `⚡ 戳一下，接收属于你的灵魂共鸣短句`;
                }
            }, 4000);
        }
    }
    
    const lingxiBtn = document.getElementById('lingxiSurpriseBtn');
    if (lingxiBtn) {
        lingxiBtn.addEventListener('click', showRandomLingxi);
    }
</script>
</body>
</html>
