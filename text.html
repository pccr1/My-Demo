<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>灵犀运势馆 · 测试</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="/common.js"></script>
    <style>
        .modal-overlay.active { display: flex; }
        .zodiac-select, .number-input {
            background: #2a2348;
            border: 1px solid #c08eff;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            color: white;
            font-size: 1rem;
            width: 100%;
            margin-top: 0.5rem;
        }
        .sign-btn {
            background: linear-gradient(95deg, #b45eff, #ff6bc0);
            border: none;
            padding: 0.8rem 1.8rem;
            font-weight: 700;
            border-radius: 60px;
            color: #0a041a;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <div class="card">
        <h1 id="testTitle">加载中...</h1>
        <div id="questionsContainer"></div>
        <button id="submitBtn" style="display: none;">✨ 查看结果 ✨</button>
        <div id="specialInputArea"></div>
        <div id="resultArea" class="result"></div>
        <div id="shareSection" class="share-section">
            <button id="shareBtn" class="share-btn"><i class="fas fa-camera"></i> 生成分享图片</button>
            <div class="share-tip">✨ 点击生成精美图片，长按保存分享 ✨</div>
        </div>
        <div id="rewardSection" class="reward-section">
            <div class="reward-title">🌸 如果觉得不错，可以赏我一点辛苦费~ 🌸</div>
            <div class="reward-codes">
                <div class="reward-item"><img src="/picture/weixin_1.jpg" alt="微信赞赏码"><br>微信赞赏</div>
                <div class="reward-item"><img src="/picture/zhifubao_1.jpg" alt="支付宝赞赏码"><br>支付宝赞赏</div>
            </div>
        </div>
    </div>
    <div class="footer">🌙 遇事不决灵占馆 · 运势占卜</div>
</div>

<div id="shareImageContainer" class="share-image-container"></div>
<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <img id="modalImage" src="" alt="分享图片">
        <div class="close-tip">✨ 长按图片保存，点击空白处关闭 ✨</div>
    </div>
</div>

<script>
    // ========== 新增：地支计算与彩蛋 ==========
    function getEarthlyBranchInfo() {
        const today = new Date();
        const dayNum = today.getDate();
        const index = (dayNum - 1) % 12 + 1;
        const branchNames = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
        const branch = branchNames[index - 1];
        const branchElement = {
            "寅":"木","卯":"木","巳":"火","午":"火","申":"金","酉":"金",
            "亥":"水","子":"水","辰":"土","戌":"土","丑":"土","未":"土"
        };
        const element = branchElement[branch] || "土";
        return { branch, element, dayNum };
    }

    const branchEggMap = {
        "木": "地支今日带木，别光想不做，动起来比躺着管用。",
        "火": "地支今日带火，容易上头。建议先深呼吸3次再行动。",
        "土": "地支今日带土，适合稳稳地做，别求快。慢就是顺。",
        "金": "地支今日带金，别跟钱过不去——省下一杯奶茶钱也算赚。",
        "水": "地支今日带水，情绪容易泛滥。找个人说说话，别憋着。"
    };

    // ========== 原有辅助函数（保留） ==========
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function scrollToResult() {
        const resultDiv = document.getElementById('resultArea');
        if (resultDiv && resultDiv.style.display !== 'none') {
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            setTimeout(() => {
                const res = document.getElementById('resultArea');
                if (res && res.style.display !== 'none') res.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
    }

    function showShareAndReward() {
        const shareSection = document.getElementById('shareSection');
        const rewardSection = document.getElementById('rewardSection');
        if (shareSection) shareSection.style.display = 'block';
        if (rewardSection) rewardSection.style.display = 'block';
    }

    // ========== 原有 URL 参数与全局变量 ==========
    const urlParams = new URLSearchParams(window.location.search);
    const testId = urlParams.get('id');
    if (!testId) {
        document.getElementById('testTitle').innerText = '参数错误，请返回首页重新进入。';
    } else {
        fetch(`/data/${testId}.json`)
            .then(res => res.json())
            .then(data => {
                window.testData = data;
                document.getElementById('testTitle').innerHTML = data.title;
                initTest(data);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('testTitle').innerText = '加载失败，请刷新重试。';
            });
    }

    window.answers = [];
    let currentResultKey = '';
    let currentResultText = '';

    function initTest(data) {
        const logic = data.resultLogic;

        // 特殊逻辑分支
        if (logic === 'special_zodiac_advanced') {
            renderAdvancedZodiacTest(data);
        } else if (logic === 'special_zodiac') {
            renderZodiacTest(data);
        } else if (logic === 'special_mood_number') {
            renderMoodNumberTest(data);
        } else if (logic === 'special_random_sign') {
            renderRandomSignTest(data);
        } else {
            // 普通计分测试
            const questions = data.questions;
            window.answers = new Array(questions.length).fill(null);

            let html = '';
            questions.forEach((q, idx) => {
                html += `<div class="question-item">
                            <div class="question-text">${escapeHtml(q.text)}</div>
                            <div class="options-group" data-qidx="${idx}">`;
                q.options.forEach((opt, oidx) => {
                    html += `<label class="opt-label" data-oidx="${oidx}">${escapeHtml(opt)}<input type="radio" name="q${idx}" value="${oidx}"></label>`;
                });
                html += `</div></div>`;
            });
            document.getElementById('questionsContainer').innerHTML = html;
            document.getElementById('submitBtn').style.display = 'block';
            attachOptionEvents();

            document.getElementById('submitBtn').onclick = () => {
                const result = computeResult(data);
                if (result === null) {
                    alert('请先完成所有题目');
                    return;
                }
                currentResultKey = result.name;
                currentResultText = result.text;
                const resultDiv = document.getElementById('resultArea');
                resultDiv.innerHTML = `<strong>✨ ${data.title} 结果：${result.name} ✨</strong><br><br>${result.text}`;
                resultDiv.style.display = 'block';
                showShareAndReward();
                scrollToResult();
            };
        }

        // 统一绑定分享按钮
        const shareBtn = document.getElementById('shareBtn');
        if (shareBtn) {
            shareBtn.onclick = null;
            shareBtn.onclick = async () => {
                if (!currentResultKey) {
                    alert('请先完成测试并查看结果');
                    return;
                }
                await generateShareImage(data.title, currentResultKey, currentResultText);
            };
        }
    }

    // ========== 新版：高级星座贵人（带3个小问题） ==========
    function renderAdvancedZodiacTest(data) {
        // 构建星座下拉列表
        const zodiacs = data.zodiacList || ["白羊座","金牛座","双子座","巨蟹座","狮子座","处女座","天秤座","天蝎座","射手座","摩羯座","水瓶座","双鱼座"];
        let html = `<div class="question-item">
                        <div class="question-text">你的星座是什么？</div>
                        <select id="userZodiacSelect" class="zodiac-select">`;
        zodiacs.forEach(z => { html += `<option value="${z}">${z}</option>`; });
        html += `</select></div>`;
        // 添加3个小问题
        data.questions.forEach((q, idx) => {
            html += `<div class="question-item">
                        <div class="question-text">${escapeHtml(q.text)}</div>
                        <div class="options-group" data-qidx="${idx}">`;
            q.options.forEach((opt, oidx) => {
                html += `<label class="opt-label" data-oidx="${oidx}">${escapeHtml(opt)}<input type="radio" name="advanced_q${idx}" value="${q.scores[oidx]}"></label>`;
            });
            html += `</div></div>`;
        });
        html += `<button id="advancedZodiacSubmitBtn" class="sign-btn">✨ 查看今日贵人 ✨</button>`;
        document.getElementById('specialInputArea').innerHTML = html;
        attachOptionEvents();

        document.getElementById('advancedZodiacSubmitBtn').onclick = () => {
            const userZodiac = document.getElementById('userZodiacSelect').value;
            // 收集3题得分
            let totalScore = 0;
            for (let i = 0; i < 3; i++) {
                let selected = document.querySelector(`input[name="advanced_q${i}"]:checked`);
                if (!selected) { alert("请完成所有小问题"); return; }
                totalScore += parseInt(selected.value);
            }
            const { element: earthElement, dayNum } = getEarthlyBranchInfo();
            const userElement = data.userElementMap[userZodiac];
            // 生我者为贵人
            const elementGenerate = { "火":"木", "土":"火", "木":"水", "水":"金", "金":"土" };
            const guiElement = elementGenerate[userElement];
            const guiPool = data.elementToZodiacs[guiElement];
            const baseIdx = (dayNum - 1) % 3;
            const offset = totalScore % 3;
            const finalIdx = (baseIdx + offset) % 3;
            const guiZodiac = guiPool[finalIdx];
            // 地支毒舌（五行生克关系）
            const shengMap = { "木":"火", "火":"土", "土":"金", "金":"水", "水":"木" };
            let relationship = "";
            if (shengMap[earthElement] === userElement) relationship = "相生";
            else if (shengMap[userElement] === earthElement) relationship = "相克";
            else if (earthElement === userElement) relationship = "相同";
            else relationship = "用户克地支";
            const duSheMap = {
                "相生": "今天地气帮你，贵人会主动靠近你。但你懒的话，到嘴的鸭子也会飞。",
                "相克": "今天天时不太顺，贵人可能需要你主动撩一下。别干等，发个表情包。",
                "相同": "今天能量同频，贵人会出现得像外卖一样快。但别贪心，一个就够了。",
                "用户克地支": "今天你气场强，贵人可能有点怕你。温柔点，别把人家吓跑。"
            };
            const duShe = duSheMap[relationship];
            let template = data.resultTexts[userZodiac][guiZodiac];
            const finalText = template.replace("{{地支毒舌}}", duShe);
            currentResultKey = `${userZodiac} → ${guiZodiac}`;
            currentResultText = finalText;
            const resultDiv = document.getElementById('resultArea');
            resultDiv.innerHTML = `<strong>✨ 今日星座贵人 ✨</strong><br><br>${finalText}`;
            resultDiv.style.display = 'block';
            showShareAndReward();
            scrollToResult();
        };
    }

    // ========== 原版简单星座贵人（保留） ==========
    function renderZodiacTest(data) {
        const zodiacs = ["白羊座","金牛座","双子座","巨蟹座","狮子座","处女座","天秤座","天蝎座","射手座","摩羯座","水瓶座","双鱼座"];
        let html = `<div class="question-item">
                        <div class="question-text">你的星座是什么？</div>
                        <select id="zodiacSelect" class="zodiac-select">`;
        zodiacs.forEach(z => { html += `<option value="${z}">${z}</option>`; });
        html += `</select></div><button id="zodiacSubmitBtn" class="sign-btn">✨ 查看贵人 ✨</button>`;
        document.getElementById('specialInputArea').innerHTML = html;
        document.getElementById('zodiacSubmitBtn').onclick = () => {
            const zodiac = document.getElementById('zodiacSelect').value;
            const result = data.resultMap[zodiac];
            if (result) {
                currentResultKey = zodiac;
                currentResultText = result;
                const resultDiv = document.getElementById('resultArea');
                resultDiv.innerHTML = `<strong>✨ 你的贵人指引 ✨</strong><br><br>${result}`;
                resultDiv.style.display = 'block';
                showShareAndReward();
                scrollToResult();
            } else {
                alert('星座数据错误');
            }
        };
    }

    // ========== 心情数字测试（增加地支彩蛋） ==========
    function renderMoodNumberTest(data) {
        let html = `<div class="question-item">
                        <div class="question-text">请凭直觉输入一个数字（1-10）：</div>
                        <input type="number" id="moodNumber" class="number-input" min="1" max="10" step="1" value="5">
                    </div>
                    <button id="moodSubmitBtn" class="sign-btn">✨ 查看心情行动 ✨</button>`;
        document.getElementById('specialInputArea').innerHTML = html;
        document.getElementById('moodSubmitBtn').onclick = () => {
            let num = parseInt(document.getElementById('moodNumber').value);
            if (isNaN(num)) num = 5;
            num = Math.min(10, Math.max(1, num));
            let text = data.resultMap[num.toString()];
            if (text) {
                const { element } = getEarthlyBranchInfo();
                const egg = branchEggMap[element] || "";
                const finalText = text + (egg ? "\n\n" + egg : "");
                currentResultKey = num.toString();
                currentResultText = finalText;
                const resultDiv = document.getElementById('resultArea');
                resultDiv.innerHTML = `<strong>✨ 你的心情行动数字：${num} ✨</strong><br><br>${finalText}`;
                resultDiv.style.display = 'block';
                showShareAndReward();
                scrollToResult();
            } else {
                alert('数据错误');
            }
        };
    }

    // ========== 随机签语测试（增加地支彩蛋） ==========
    function renderRandomSignTest(data) {
        let html = `<button id="drawSignBtn" class="sign-btn"><i class="fas fa-hand-peace"></i> 摇一摇 / 抽一签</button>`;
        document.getElementById('specialInputArea').innerHTML = html;
        document.getElementById('drawSignBtn').onclick = () => {
            const signs = data.signs;
            const randomIndex = Math.floor(Math.random() * signs.length);
            let text = signs[randomIndex];
            const { element } = getEarthlyBranchInfo();
            const egg = branchEggMap[element] || "";
            const finalText = text + (egg ? "\n\n" + egg : "");
            currentResultKey = `签语${randomIndex+1}`;
            currentResultText = finalText;
            const resultDiv = document.getElementById('resultArea');
            resultDiv.innerHTML = `<strong>✨ 今日能量签语 ✨</strong><br><br>${finalText}`;
            resultDiv.style.display = 'block';
            showShareAndReward();
            scrollToResult();
        };
    }

    // ========== 原有通用计分逻辑（保持不变） ==========
    function computeResult(data) {
        const logic = data.resultLogic;
        const questions = data.questions;
        for (let i = 0; i < questions.length; i++) {
            if (window.answers[i] === null) return null;
        }

        if (logic === 'sum_range') {
            let total = 0;
            for (let i = 0; i < questions.length; i++) {
                const scoreMap = questions[i].scoreMap;
                if (scoreMap) total += scoreMap[window.answers[i]];
                else total += (window.answers[i] + 1);
            }
            for (let range of data.resultRanges) {
                if (total >= range.min && total <= range.max) return { name: range.name, text: range.text };
            }
            return { name: '未知', text: '结果计算有误。' };
        }
        else if (logic === 'dimension_highest') {
            if (!data.dimensions || !data.dimensionsPriority) {
                return { name: '错误', text: '数据配置错误：缺少 dimensions 字段。' };
            }
            let dimScores = {};
            data.dimensions.forEach(d => { dimScores[d] = 0; });
            for (let i = 0; i < questions.length; i++) {
                const dims = questions[i].dimensions[window.answers[i]];
                if (dims) {
                    for (let [dim, score] of Object.entries(dims)) {
                        dimScores[dim] += score;
                    }
                }
            }
            const totalScore = Object.values(dimScores).reduce((a, b) => a + b, 0);
            if (totalScore === 0 && data.specialZeroResult) {
                return { name: data.specialZeroResult.name, text: data.specialZeroResult.text };
            }
            let maxScore = -1, bestDim = null;
            for (let dim of data.dimensionsPriority) {
                if (dimScores[dim] > maxScore) {
                    maxScore = dimScores[dim];
                    bestDim = dim;
                }
            }
            return { name: bestDim, text: data.resultTexts[bestDim] };
        }
        else if (logic === 'comparison') {
            let scoreA = 0, scoreB = 0;
            for (let i = 0; i < questions.length; i++) {
                const [a, b] = questions[i].scores[window.answers[i]];
                scoreA += a;
                scoreB += b;
            }
            const diff = data.comparisonDiff || 3;
            if (scoreA >= scoreB + diff) return { name: data.resultNames[0], text: data.resultTexts[data.resultNames[0]] };
            if (scoreB >= scoreA + diff) return { name: data.resultNames[1], text: data.resultTexts[data.resultNames[1]] };
            return { name: data.resultNames[2], text: data.resultTexts[data.resultNames[2]] };
        }
        else if (logic === 'special_love_q4') {
            let compound = 0, release = 0;
            let q3Answer = null, q4Answer = null;
            for (let i = 0; i < questions.length; i++) {
                const [c, r] = questions[i].scores[window.answers[i]];
                compound += c;
                release += r;
                if (i === 2) q3Answer = window.answers[i];
                if (i === 3) q4Answer = window.answers[i];
            }
            if (compound >= 14 && q3Answer === 3) return { name: "雨停牌", text: data.resultTexts["雨停牌"] };
            if (compound >= 14 && q4Answer === 2) return { name: "未完成牌", text: data.resultTexts["未完成牌"] };
            if (release >= 14) return { name: "枯木牌", text: data.resultTexts["枯木牌"] };
            return { name: "回廊牌", text: data.resultTexts["回廊牌"] };
        }
        else if (logic === 'special_love_q8') {
            let total = 0;
            for (let i = 0; i < questions.length; i++) total += questions[i].scores[window.answers[i]];
            for (let range of data.resultRanges) {
                if (total >= range.min && total <= range.max) return { name: range.name, text: range.text };
            }
            return { name: '未知', text: '结果计算有误。' };
        }
        else if (logic === 'special_love_q9') {
            let total = 0;
            let q6Answer = null;
            for (let i = 0; i < questions.length; i++) {
                total += questions[i].scores[window.answers[i]];
                if (i === 5) q6Answer = window.answers[i];
            }
            if (total >= 6) {
                if (q6Answer === 0) return { name: "会明朗 + 对方后撤或你下头", text: data.resultTexts["会明朗 + 对方后撤或你下头"] };
                else return { name: "会明朗 + 可能在一起", text: data.resultTexts["会明朗 + 可能在一起"] };
            }
            if (total <= -5) return { name: "不会明朗", text: data.resultTexts["不会明朗"] };
            return { name: "视情况而定", text: data.resultTexts["视情况而定"] };
        }
        else {
            return { name: '未知', text: '暂不支持此结果逻辑。' };
        }
    }
</script>
</body>
</html>
